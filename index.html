<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>教室表示</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  height:100vh;
  overflow:hidden;
  font-family:'Noto Sans JP',sans-serif;
  background:linear-gradient(135deg,#d9f3ff,#fff7d6);
}

/* ===== 全体 ===== */
.container{
  height:100%;
  display:flex;
  flex-direction:column;
}

/* ===== 上 ===== */
.top{
  height:22%;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

#clock{
  font-size:13vh;
}

/* クラス */
#control{
  position:absolute;
  left:10px;
  top:10px;
}
#cls{
  font-size:3vh;
}
#control button{
  font-size:2.5vh;
}

/* ===== 下 ===== */
.main{
  flex:1;
  display:flex;
  gap:10px;
  padding:10px;
}

/* 日課 */
.card{
  flex:0.8;
  background:white;
  border-radius:12px;
  padding:10px;
  display:flex;
  flex-direction:column;
}

.header{
  font-size:3.5vh;
  text-align:center;
}

.row{
  display:flex;
  align-items:center;
  margin:5px 0;
}

.period{
  width:5em;
  font-size:2.5vh;
}

.subject{
  flex:1;
  font-size:4vh;
  padding-left:10px;
}
.subject:empty::before{content:"　";}

.plan{
  font-size:2.8vh;
  background:#fff3cd;
  margin-top:auto;
  padding:6px;
}

/* 右 */
.right{
  flex:1.2;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.tool{
  flex:0.8;
  background:white;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:space-around;
}

/* 数字 */
.big{
  font-size:6vh;
  width:200px;
  text-align:center;
}

/* ボタン */
.buttons{
  display:flex;
  flex-direction:column;
  align-items:center;
}
.btn-row{
  display:flex;
}
button{
  margin:2px;
  padding:5px 8px;
  font-size:2.5vh;
  border:none;
  border-radius:6px;
  background:#6fa8dc;
  color:white;
}

/* 抽選 */
.draw{
  display:flex;
  align-items:center;
  gap:10px;
}
.max{
  font-size:2.5vh;
}
</style>
</head>

<body>

<div class="container">

<div class="top">
<div id="control">
<select id="cls"></select>
<button onclick="reload()">⟳</button>
</div>
<div id="clock"></div>
</div>

<div class="main">

<div class="card">
<div class="header" id="todayH"></div>
<div id="today"></div>
<div class="plan" id="todayP"></div>
</div>

<div class="card">
<div class="header" id="tomorrowH"></div>
<div id="tomorrow"></div>
<div class="plan" id="tomorrowP"></div>
</div>

<div class="right">

<div class="tool">
<div class="big" id="timer">00:00</div>
<div class="buttons">
<div class="btn-row">
<button onclick="add(600)">＋10分</button>
<button onclick="add(60)">＋1分</button>
</div>
<div class="btn-row">
<button onclick="add(10)">＋10秒</button>
<button onclick="add(1)">＋1秒</button>
</div>
<div class="btn-row">
<button onclick="startTimer()">開始</button>
<button onclick="resetTimer()">リセット</button>
</div>
</div>
</div>

<div class="tool">
<div class="big" id="sw">00:00.0</div>
<div class="buttons">
<button onclick="startSW()">開始</button>
<button onclick="stopSW()">停止</button>
<button onclick="resetSW()">リセット</button>
</div>
</div>

<div class="tool">
<div class="draw">
<div class="big" id="res">-</div>
<div class="max">/ <span id="max">40</span></div>
</div>
<div class="buttons">
<div class="btn-row">
<button onclick="chg(-10)">-10</button>
<button onclick="chg(-1)">-1</button>
<button onclick="chg(1)">+1</button>
<button onclick="chg(10)">+10</button>
</div>
<div class="btn-row">
<button onclick="drawNum()">抽選</button>
<button onclick="resetR()">リセット</button>
</div>
</div>
</div>

</div>
</div>

</div>

<script>
/* 時計 */
setInterval(()=>clock.textContent=new Date().toLocaleTimeString(),1000);

/* クラス */
const list=[
"1-1","1-2","1-3","1-4",
"2-1","2-2","2-3","2-4",
"3-1","3-2","3-3","3-4",
"s-1","s-2","s-3",
"a-1","a-2","a-3"
];
list.forEach(c=>cls.innerHTML+=`<option>${c}</option>`);
let current="3-1";

/* CSV */
const URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ6hu2HGH9XN1d3Pj8euPrv49TgqM-GsPJNqge6IiRoqvXpNWuRFteTEufF-ffT5WDpYtG4W25h4bxI/pub?gid=0&single=true&output=csv";

async function load(){
const res=await fetch(URL);
const txt=await res.text();
const rows=txt.split("\n").map(r=>r.replace(/\r/g,""));

/* 改行対策 */
const rows=txt.split("\n").map(r=>r.replace(/\r/g,""));

let data={};
rows.forEach(r=>{
let c=r.split(",");
if(c[1]!=current)return;
data[c[0]]=c;
});

let now=new Date();
let k=now.toISOString().split("T")[0];

function make(d){
const w=["日","月","火","水","木","金","土"];
return `${d.getMonth()+1}/${d.getDate()}(${w[d.getDay()]})`;
}

today.innerHTML="";
todayP.textContent="";
todayH.textContent="";

if(data[k] && data[k].slice(2,8).some(v=>v)){
draw(today,data[k]);
todayH.textContent=make(now)+" "+(data[k][8]||"");
todayP.textContent=data[k][9]||"";
}

/* ===== 翌日（次の登校日） ===== */
let d=new Date(now);
tomorrow.innerHTML="";
tomorrowP.textContent="";
tomorrowH.textContent="";

for(let i=0;i<10;i++){
d.setDate(d.getDate()+1);
let kk=d.toISOString().split("T")[0];

if(data[kk] && data[kk].slice(2,8).some(v=>v)){
draw(tomorrow,data[kk]);
tomorrowH.textContent=make(d)+" "+(data[kk][8]||"");
tomorrowP.textContent=data[kk][9]||"";
break;
}
}
}

function draw(el,row){
let h="";
for(let i=2;i<=7;i++){
h+=`<div class="row">
<div class="period">${i-1}時間目</div>
<div class="subject">${row[i]||""}</div>
</div>`;
}
el.innerHTML=h;
}

function reload(){current=cls.value; load();}
load();

/* ===== タイマー ===== */
let t=0,ti;
function add(s){t+=s;disp();}
function disp(){
timer.textContent=`${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;
}

/* ★アラーム完全修正版 */
let audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function beep(){
  const now = audioCtx.currentTime;

  // 4回 × 4セット
  for(let set=0; set<4; set++){
    for(let i=0; i<4; i++){
      const t = now + set*1.0 + i*0.2;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = "square";
      osc.frequency.value = 1000;

      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.5, t + 0.01);
      gain.gain.linearRampToValueAtTime(0, t + 0.15);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(t);
      osc.stop(t + 0.15);
    }
  }
}

function startTimer(){
if(ti)return;

ti=setInterval(()=>{
if(t===0){
clearInterval(ti);
ti=null;
beep(); // 即鳴る
return;
}
t--;
disp();
},1000);
}

function resetTimer(){clearInterval(ti);ti=null;t=0;disp();}

/* ===== SW ===== */
let swt=0,swi;
function startSW(){
if(swi)return;
swi=setInterval(()=>{
swt++;
let m=Math.floor(swt/600);
let s=Math.floor((swt%600)/10);
let ms=swt%10;
sw.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${ms}`;
},100);
}
function stopSW(){clearInterval(swi);swi=null;}
function resetSW(){stopSW();swt=0;sw.textContent="00:00.0";}

/* ===== 抽選 ===== */
let maxN=40;

function chg(n){
maxN+=n;
if(maxN<1)maxN=1;
max.textContent=maxN; // 表示はそのまま
}

/* ★名前変更で衝突回避 */
function drawNum(){
res.textContent=Math.floor(Math.random()*maxN)+1;
}

function resetR(){res.textContent="-";}
</script>

</body>
</html>
