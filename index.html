<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>教室表示</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  height:100vh;
  overflow:hidden;
  font-family:'Noto Sans JP',sans-serif;
  background:linear-gradient(135deg,#d9f3ff,#fff7d6);
}

/* ===== 全体 ===== */
.container{
  height:100%;
  display:flex;
  flex-direction:column;
}

/* ===== 上 ===== */
.top{
  height:18%;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

#clock{
  font-size:8vw;
}

/* クラス */
#control{
  position:absolute;
  left:10px;
  top:10px;
}
#cls{
  font-size:3vh;
}
#control button{
  font-size:2.5vh;
}

/* ===== 下 ===== */
.main{
  flex:1;
  min-height:0;
  display:flex;
  gap:6px;
  padding:6px;
  box-sizing:border-box;
}

/* ===== 日課 ===== */
.card{
  flex:0.72;
  min-height:0;
  box-sizing:border-box;
  background:white;
  border-radius:12px;
  padding:12px;
  display:flex;
  flex-direction:column;
}

/* ===== 時程 ===== */
.schedule{
  flex:0.35;
  min-height:0;
  box-sizing:border-box;
  background:white;
  border-radius:12px;
  padding:70px 6px 6px 6px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.schedule .row{
  display:flex;
  align-items:center;
  justify-content:center;
  margin:3px 0;
  height:7.5vh;
  box-sizing:border-box;
}

.schedule .time{
  font-size:4.5vh;
  line-height:1.1;
  text-align:center;
}

/* ===== 日課共通 ===== */
.header{
  font-size:4.5vh;
  text-align:center;
}

.row{
  display:flex;
  align-items:center;
  margin:3px 0;
}

.period{
  width:5em;
  font-size:3.2vh;
}

.subject{
  flex:1;
  font-size:5.2vh;
  padding-left:10px;
}

/* ===== 連絡 ===== */
.plan{
  font-size:3.4vh;
  line-height:1.45;
  background:#fff3cd;
  margin-top:auto;
  padding:6px;
  box-sizing:border-box;
  border-radius:12px;
}

/* 右 */
.right{
  flex:1.0;
  display:flex;
  flex-direction:column;
  gap:4px;
}

.tool{
  height:30%;
  min-height:0;
  background:white;
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  box-sizing:border-box;
}

/* 数字 */
.big{
  font-size:4vw;
  width:200px;
  text-align:center;
}

/* ボタン */
.buttons{
  display:flex;
  flex-direction:column;
  align-items:center;
}
.btn-row{
  display:flex;
}
button{
  margin:2px;
  padding:5px 8px;
  font-size:2.5vh;
  border:none;
  border-radius:6px;
  background:#6fa8dc;
  color:white;
}

/* 抽選 */
.draw{
  display:flex;
  align-items:center;
  gap:10px;
}
.max{
  font-size:2.5vh;
}
</style>
</head>

<body>

<div class="container">

<div class="top">
<div id="control">
<select id="cls"></select>
<button onclick="reload()">⟳</button>
</div>
<div id="clock"></div>
</div>

<div class="main">

<div class="schedule">
<div class="header schedule-title"></div>
<div id="scheduleToday"></div>
</div>

<div class="card">
<div class="header" id="todayH"></div>
<div id="today"></div>
<div class="plan" id="todayP"></div>
</div>

<div class="card">
<div class="header" id="tomorrowH"></div>
<div id="tomorrow"></div>
<div class="plan" id="tomorrowP"></div>
</div>

<div class="right">

<div class="tool">
<div class="big" id="timer">00:00</div>
<div class="buttons">
<div class="btn-row">
<button onclick="add(600)">＋10分</button>
<button onclick="add(60)">＋1分</button>
</div>
<div class="btn-row">
<button onclick="add(10)">＋10秒</button>
<button onclick="add(1)">＋1秒</button>
</div>
<div class="btn-row">
<button onclick="startTimer()">開始</button>
<button onclick="resetTimer()">リセット</button>
</div>
</div>
</div>

<div class="tool">
<div class="big" id="sw">00:00.0</div>
<div class="buttons">
<button onclick="startSW()">開始</button>
<button onclick="stopSW()">停止</button>
<button onclick="resetSW()">リセット</button>
</div>
</div>

<div class="tool">
<div class="draw">
<div class="big" id="res">-</div>
<div class="max">/ <span id="max">40</span></div>
</div>
<div class="buttons">
<div class="btn-row">
<button onclick="chg(-10)">-10</button>
<button onclick="chg(-1)">-1</button>
<button onclick="chg(1)">+1</button>
<button onclick="chg(10)">+10</button>
</div>
<div class="btn-row">
<button onclick="drawNum()">抽選</button>
<button onclick="resetR()">リセット</button>
</div>
</div>
</div>

</div>
</div>

</div>

<script>
/* 時計 */
setInterval(()=>clock.textContent=new Date().toLocaleTimeString(),1000);


/* クラス */
const list=[
"1-1","1-2","1-3","1-4",
"2-1","2-2","2-3","2-4",
"3-1","3-2","3-3","3-4",
"s-1","s-2","s-3",
"a-1","a-2","a-3"
];

list.forEach(c=>cls.innerHTML+=`<option>${c}</option>`);

let current="3-1";
cls.value=current;


/* ===== CSV ===== */

/* 日課 */
const URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ6hu2HGH9XN1d3Pj8euPrv49TgqM-GsPJNqge6IiRoqvXpNWuRFteTEufF-ffT5WDpYtG4W25h4bxI/pub?gid=0&single=true&output=csv";

/* 時程（Sheet2） */
const SCHEDULE_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ6hu2HGH9XN1d3Pj8euPrv49TgqM-GsPJNqge6IiRoqvXpNWuRFteTEufF-ffT5WDpYtG4W25h4bxI/pub?gid=231911300&single=true&output=csv";


/* ===== データ読み込み ===== */

async function load(){

  /* ===== 日課データ ===== */

  let data={};
  console.log("★★ load開始 ★★");
  try{

    const res=await fetch(URL + "&t=" + Date.now());

    if(!res.ok){
      throw new Error("日課CSVの取得に失敗");
    }

    const txt=await res.text();

    const rows=txt
      .split("\n")
      .map(r=>r.replace(/\r/g,"").trim())
      .filter(r=>r);

    rows.forEach(r=>{

      const c=r.split(",").map(v=>v.trim());

      if(c.length<10)return;
      if(c[0].toLowerCase()==="date")return;

      const date=c[0];
      const className=c[1];

      if(className!==current)return;

      data[date]=c;

    });

  }catch(e){

    console.error("日課データ取得エラー",e);

  }


  /* ===== 時程データ ===== */

  let scheduleData={};

  try{

    const sres=await fetch(SCHEDULE_URL + "&t=" + Date.now());

    if(!sres.ok){
      throw new Error("時程CSVの取得に失敗");
    }

    const stxt=await sres.text();

    const srows=stxt
      .split("\n")
      .map(r=>r.replace(/\r/g,"").trim())
      .filter(r=>r);

    srows.forEach(r=>{

      const c=r.split(",").map(v=>v.trim());

      if(c.length<10)return;
      if(c[0].toLowerCase()==="date")return;

      const date=c[0];
      const className=c[1];

      if(className!==current)return;

      scheduleData[date]=c;

    });

  }catch(e){

    console.error("時程データ取得エラー",e);

  }


  /* ===== 今日の日付 ===== */

  const now=new Date();

  const k =
    now.getFullYear() + "-" +
    String(now.getMonth()+1).padStart(2,"0") + "-" +
    String(now.getDate()).padStart(2,"0");

    console.log("今日の日付キー:",k);
    console.log("日課データ:",data);
    console.log("時程データ:",scheduleData);

  function make(d){

    const w=["日","月","火","水","木","金","土"];

    return `${d.getMonth()+1}/${d.getDate()}(${w[d.getDay()]})`;

  }


  /* ===== 時程 ===== */

  scheduleToday.innerHTML="";

  if(scheduleData[k]){

    const s=scheduleData[k];

    let h="";

    /*
      0 = date
      1 = class
      2 = break
      3 = time
      4 = p1
      5 = p2
      6 = p3
      7 = p4
      8 = p5
      9 = p6
    */

    for(let i=4;i<=9;i++){

      if(s[i]){

        h+=`
        <div class="row">
          <div class="time">${s[i]}～</div>
        </div>
        `;

      }

    }

    scheduleToday.innerHTML=h;

  }


  /* ===== 本日 ===== */

  today.innerHTML="";
  todayP.textContent="";
  todayH.textContent="";

  if(data[k]){

    draw(today,data[k]);

    todayH.textContent=
      make(now)+" "+(data[k][8]||"");

    todayP.textContent=
      data[k][9]||"";

  }


  /* ===== 翌日（次の登校日） ===== */

  let d=new Date(now);

  tomorrow.innerHTML="";
  tomorrowP.textContent="";
  tomorrowH.textContent="";

  for(let i=0;i<10;i++){

    d.setDate(d.getDate()+1);

    const kk =
      d.getFullYear() + "-" +
      String(d.getMonth()+1).padStart(2,"0") + "-" +
      String(d.getDate()).padStart(2,"0");

    if(data[kk]){

      draw(tomorrow,data[kk]);

      tomorrowH.textContent=
        make(d)+" "+(data[kk][8]||"");

      tomorrowP.textContent=
        data[kk][9]||"";

      break;

    }

  }

}


/* ===== 日課を描画 ===== */

function draw(el,row){

let h="";

for(let i=2;i<=7;i++){

h+=`<div class="row">
<div class="period">${i-1}時間目</div>
<div class="subject">${row[i]||""}</div>
</div>`;

}

el.innerHTML=h;

}


/* ===== クラス変更 ===== */

function reload(){

current=cls.value;

load();

}

load();


/* ===== タイマー ===== */

let t=0,ti;

function add(s){

t+=s;

disp();

}

function disp(){

timer.textContent=
`${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;

}


/* ===== アラーム ===== */

let audioCtx =
new (window.AudioContext || window.webkitAudioContext)();


function beep(){

const now=audioCtx.currentTime;

for(let set=0;set<4;set++){

for(let i=0;i<4;i++){

const t=now+set*1.0+i*0.2;

const osc=audioCtx.createOscillator();

const gain=audioCtx.createGain();

osc.type="square";

osc.frequency.value=1000;

gain.gain.setValueAtTime(0,t);

gain.gain.linearRampToValueAtTime(0.1,t+0.01);

gain.gain.linearRampToValueAtTime(0,t+0.15);

osc.connect(gain);

gain.connect(audioCtx.destination);

osc.start(t);

osc.stop(t+0.15);

}

}

}


function startTimer(){

if(ti)return;

ti=setInterval(()=>{

if(t===0){

clearInterval(ti);

ti=null;

beep();

return;

}

t--;

disp();

},1000);

}


function resetTimer(){

clearInterval(ti);

ti=null;

t=0;

disp();

}


/* ===== ストップウォッチ ===== */

let swt=0,swi;

function startSW(){

if(swi)return;

swi=setInterval(()=>{

swt++;

let m=Math.floor(swt/600);

let s=Math.floor((swt%600)/10);

let ms=swt%10;

sw.textContent=
`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${ms}`;

},100);

}

function stopSW(){

clearInterval(swi);

swi=null;

}

function resetSW(){

stopSW();

swt=0;

sw.textContent="00:00.0";

}


/* ===== 抽選 ===== */

let maxN=40;


function chg(n){

maxN+=n;

if(maxN<1)maxN=1;

max.textContent=maxN;

}


function drawNum(){

res.textContent=Math.floor(Math.random()*maxN)+1;

}


function resetR(){

res.textContent="-";

}

</script>
</body>
</html>
