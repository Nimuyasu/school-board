<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>教室表示</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  height:100vh;
  display:flex;
  flex-direction:column;
  background:linear-gradient(135deg,#cfe8ff,#fff3c9);
}

/* 上部 */
.top{
  display:flex;
  align-items:center;
  padding:10px 20px;
}

select{
  font-size:28px;
  padding:5px 10px;
}

button{
  margin-left:10px;
  font-size:20px;
  padding:6px 10px;
  border:none;
  border-radius:6px;
  background:#6fa8dc;
  color:white;
  cursor:pointer;
}

/* 時計 */
.clock{
  text-align:center;
  font-size:180px;
  font-weight:bold;
  line-height:1;
}

/* メイン */
.main{
  flex:1;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:15px;
  padding:10px 20px 20px;
}

/* 日課 */
.card{
  background:white;
  border-radius:15px;
  padding:15px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.date{
  font-size:32px;
  font-weight:bold;
  text-align:center;
  margin-bottom:10px;
}

.row{
  display:flex;
  align-items:center;
  margin:6px 0;
}

.period{
  width:90px;
  font-size:22px;
}

.subject{
  flex:1;
  font-size:32px;
  text-align:left;
}

.plan{
  background:#f3e2b8;
  margin-top:10px;
  padding:10px;
  font-size:24px;
}

/* 右側ツール */
.tools{
  display:flex;
  flex-direction:column;
  gap:15px;
}

.tool{
  background:white;
  border-radius:15px;
  padding:15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

/* 数字 */
.big{
  font-size:60px;
  font-weight:bold;
  min-width:200px;
  text-align:center;
}

/* ボタン群 */
.btns{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  justify-content:center;
}

/* 抽選固定幅 */
.max{
  display:inline-block;
  width:50px;
  text-align:left;
}
</style>
</head>

<body>

<div class="top">
<select id="classSel">
<option>1-1</option><option>1-2</option><option>1-3</option><option>1-4</option>
<option>2-1</option><option>2-2</option><option>2-3</option><option>2-4</option>
<option>3-1</option><option>3-2</option><option>3-3</option><option>3-4</option>
<option>s-1</option><option>s-2</option><option>s-3</option>
<option>a-1</option><option>a-2</option><option>a-3</option>
</select>
<button onclick="loadData()">🔄</button>
</div>

<div class="clock" id="clock"></div>

<div class="main">
<div class="card" id="today"></div>
<div class="card" id="tomorrow"></div>

<div class="tools">

<!-- タイマー -->
<div class="tool">
<div class="big" id="timer">00:00</div>
<div class="btns">
<button onclick="addTime(600)">+10分</button>
<button onclick="addTime(60)">+1分</button>
<button onclick="addTime(10)">+10秒</button>
<button onclick="addTime(1)">+1秒</button>
<button onclick="startTimer()">開始</button>
<button onclick="resetTimer()">リセット</button>
</div>
</div>

<!-- ストップウォッチ -->
<div class="tool">
<div class="big" id="sw">00:00.0</div>
<div class="btns">
<button onclick="startSW()">開始</button>
<button onclick="stopSW()">停止</button>
<button onclick="resetSW()">リセット</button>
</div>
</div>

<!-- 抽選 -->
<div class="tool">
<div class="big"><span id="rand">-</span> / <span class="max" id="max">40</span></div>
<div class="btns">
<button onclick="changeMax(-10)">-10</button>
<button onclick="changeMax(-1)">-1</button>
<button onclick="changeMax(1)">+1</button>
<button onclick="changeMax(10)">+10</button>
<button onclick="draw()">抽選</button>
<button onclick="resetRand()">リセット</button>
</div>
</div>

</div>
</div>

<script>
/* 時計 */
setInterval(()=>{
  const d=new Date();
  clock.textContent=d.toLocaleTimeString('ja-JP',{hour12:false});
},1000);

/* CSV */
let data=[];

async function loadData(){
  const res=await fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vQ6hu2HGH9XN1d3Pj8euPrv49TgqM-GsPJNqge6IiRoqvXpNWuRFteTEufF-ffT5WDpYtG4W25h4bxI/pub?gid=0&single=true&output=csv");
  const text=await res.text();
  const rows=text.trim().split("\n").slice(1);
  data=rows.map(r=>r.split(","));
  render();
}

function format(d){
  return d.toISOString().split("T")[0];
}

/* 日課表示（←ここ修正）*/
function render(){
  const cls=document.getElementById("classSel").value;
  const today=new Date();
  const tomorrow=new Date(today);
  tomorrow.setDate(today.getDate()+1);

  show(today,"today",cls);
  show(tomorrow,"tomorrow",cls);
}

function show(date,id,cls){
  const d=format(date);

  const row=data.find(r=>r[0]===d && r[1]===cls);

  if(!row){
    document.getElementById(id).innerHTML="";
    return;
  }

  let html=`<div class="date">${d} ${row[8]}</div>`;

  for(let i=0;i<6;i++){
    html+=`
    <div class="row">
      <div class="period">${i+1}時間目</div>
      <div class="subject">${row[2+i]||""}</div>
    </div>`;
  }

  html+=`<div class="plan">${row[9]||""}</div>`;

  document.getElementById(id).innerHTML=html;
}

/* タイマー */
let t=0,tid;

function addTime(s){
  t+=s;
  updateTimer();
}

function updateTimer(){
  let m=Math.floor(t/60);
  let s=t%60;
  timer.textContent=
    String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

function startTimer(){
  clearInterval(tid);
  tid=setInterval(()=>{
    if(t>0){
      t--;
      updateTimer();

      if(t===0){
        alarm(); // ←ここで即鳴る
      }

    }
  },1000);
}

function resetTimer(){
  clearInterval(tid);
  t=0;
  updateTimer();
}

/* 🔔アラーム修正 */
function alarm(){
  let count=0;

  function beep4(){
    let i=0;
    const fast=setInterval(()=>{
      const ctx=new AudioContext();
      const o=ctx.createOscillator();
      o.connect(ctx.destination);
      o.start();
      setTimeout(()=>o.stop(),80);
      i++;
      if(i===4) clearInterval(fast);
    },120);
  }

  const loop=setInterval(()=>{
    beep4();
    count++;
    if(count===4) clearInterval(loop);
  },1000);
}

/* ストップウォッチ */
let swt=0,swid;

function startSW(){
  clearInterval(swid);
  swid=setInterval(()=>{
    swt+=0.1;
    sw.textContent=swt.toFixed(1).padStart(6,"0");
  },100);
}
function stopSW(){clearInterval(swid);}
function resetSW(){clearInterval(swid);swt=0;sw.textContent="00:00.0";}

/* 抽選 */
let max=40;

function changeMax(v){
  max=Math.max(1,max+v);
  document.getElementById("max").textContent=String(max).padStart(2," ");
}

function draw(){
  rand.textContent=Math.floor(Math.random()*max)+1;
}

function resetRand(){
  rand.textContent="-";
}

/* 初期 */
loadData();
</script>

</body>
</html>
