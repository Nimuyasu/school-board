<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>教室表示</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:linear-gradient(90deg,#cfe8f7,#f6eac2);
}

/* 上部 */
.top{
  display:flex;
  align-items:center;
  padding:10px 20px;
}

select{
  font-size:28px;
}

button{
  font-size:20px;
  margin-left:10px;
  padding:6px 10px;
  border:none;
  border-radius:6px;
  background:#6ea0d6;
  color:white;
}

/* 時計 */
.clock{
  text-align:center;
  font-size:140px;
  font-weight:bold;
}

/* 全体 */
.main{
  display:flex;
  justify-content:space-between;
  padding:10px 20px;
  gap:10px;
}

/* 日課 */
.schedule{
  width:32%;
  background:#fff;
  border-radius:12px;
  padding:10px;
}

.date{
  font-size:36px;
  font-weight:bold;
  margin-bottom:10px;
}

.row{
  display:flex;
  align-items:center;
  margin:8px 0;
}

.period{
  width:120px;
  font-size:26px;
}

.subject{
  font-size:36px;
  flex:1;
}

.plan{
  background:#f3e2b3;
  margin-top:10px;
  padding:8px;
  font-size:26px;
}

/* 右側 */
.tools{
  width:32%;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.box{
  background:#fff;
  border-radius:12px;
  padding:10px;
  text-align:center;
}

/* タイマー等 */
.flex{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
}

.time{
  font-size:60px;
  min-width:180px;
}

.btns{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  justify-content:center;
}

/* 抽選ズレ防止 */
.lottery-num{
  font-size:60px;
  width:120px;
  text-align:right;
}

.lottery-max{
  width:50px;
  display:inline-block;
  text-align:left;
}
</style>
</head>

<body>

<div class="top">
<select id="classSelect">
<option>1-1</option><option>1-2</option><option>1-3</option><option>1-4</option>
<option>2-1</option><option>2-2</option><option>2-3</option><option>2-4</option>
<option selected>3-1</option><option>3-2</option><option>3-3</option><option>3-4</option>
<option>s-1</option><option>s-2</option><option>s-3</option>
<option>a-1</option><option>a-2</option><option>a-3</option>
</select>

<button onclick="loadData()">↻</button>
</div>

<div class="clock" id="clock"></div>

<div class="main">

<!-- 今日 -->
<div class="schedule">
<div class="date" id="todayDate"></div>
<div id="todaySchedule"></div>
<div class="plan" id="todayPlan"></div>
</div>

<!-- 明日 -->
<div class="schedule">
<div class="date" id="nextDate"></div>
<div id="nextSchedule"></div>
<div class="plan" id="nextPlan"></div>
</div>

<!-- ツール -->
<div class="tools">

<!-- タイマー -->
<div class="box">
<div class="flex">
<div class="time" id="timer">00:00</div>
<div class="btns">
<button onclick="addTime(600)">+10分</button>
<button onclick="addTime(60)">+1分</button>
<button onclick="addTime(10)">+10秒</button>
<button onclick="addTime(1)">+1秒</button>
<button onclick="startTimer()">開始</button>
<button onclick="resetTimer()">リセット</button>
</div>
</div>
</div>

<!-- ストップウォッチ -->
<div class="box">
<div class="flex">
<div class="time" id="sw">00:00.0</div>
<div class="btns">
<button onclick="startSW()">開始</button>
<button onclick="stopSW()">停止</button>
<button onclick="resetSW()">リセット</button>
</div>
</div>
</div>

<!-- 抽選 -->
<div class="box">
<div class="flex">
<div class="lottery-num" id="lottery">-</div>
<div>/</div>
<div class="lottery-max" id="max">40</div>
</div>
<div class="btns">
<button onclick="changeMax(-10)">-10</button>
<button onclick="changeMax(-1)">-1</button>
<button onclick="changeMax(1)">+1</button>
<button onclick="changeMax(10)">+10</button>
<button onclick="draw()">抽選</button>
<button onclick="resetLot()">リセット</button>
</div>
</div>

</div>
</div>

<script>
/* 時計 */
setInterval(()=>{
  const d=new Date();
  document.getElementById("clock").innerText=
    d.toLocaleTimeString("ja-JP",{hour12:false});
},1000);

/* CSV */
const url="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ6hu2HGH9XN1d3Pj8euPrv49TgqM-GsPJNqge6IiRoqvXpNWuRFteTEufF-ffT5WDpYtG4W25h4bxI/pub?gid=0&single=true&output=csv";

async function loadData(){
  const res=await fetch(url);
  const text=await res.text();
  const rows=text.split("\n").map(r=>r.split(","));

  const cls=document.getElementById("classSelect").value;
  const today=new Date().toISOString().slice(0,10);

  const data=rows.find(r=>r[0]==today && r[1]==cls);

  if(!data){
    document.getElementById("todaySchedule").innerHTML="";
    document.getElementById("todayPlan").innerText="";
    return;
  }

  document.getElementById("todayDate").innerText=data[0];

  let html="";
  for(let i=2;i<=7;i++){
    html+=`
    <div class="row">
      <div class="period">${i-1}時間目</div>
      <div class="subject">${data[i]||""}</div>
    </div>`;
  }

  document.getElementById("todaySchedule").innerHTML=html;
  document.getElementById("todayPlan").innerText=data[9];
}

/* タイマー */
let t=0,tid=null,alarmPlayed=false;

function addTime(s){t+=s;updateTimer();}
function updateTimer(){
  let m=Math.floor(t/60).toString().padStart(2,"0");
  let s=(t%60).toString().padStart(2,"0");
  document.getElementById("timer").innerText=`${m}:${s}`;
}

function startTimer(){
  if(tid)return;
  alarmPlayed=false;
  tid=setInterval(()=>{
    if(t>0){
      t--;
      updateTimer();
      if(t===0 && !alarmPlayed){
        alarmPlayed=true;
        playAlarm();
      }
    }
  },1000);
}

function resetTimer(){
  clearInterval(tid);
  tid=null;
  t=0;
  updateTimer();
}

/* アラーム（修正版） */
function playAlarm(){
  let count=0;
  function beep(){
    if(count>=4)return;
    const ctx=new AudioContext();
    const osc=ctx.createOscillator();
    osc.frequency.value=800;
    osc.connect(ctx.destination);
    osc.start();
    setTimeout(()=>osc.stop(),200);
    count++;
    setTimeout(beep,1000);
  }
  beep();
}

/* ストップウォッチ */
let sw=0,swid=null;
function startSW(){
  if(swid)return;
  swid=setInterval(()=>{
    sw+=0.1;
    document.getElementById("sw").innerText=
      sw.toFixed(1).padStart(6,"0");
  },100);
}
function stopSW(){clearInterval(swid);swid=null;}
function resetSW(){sw=0;document.getElementById("sw").innerText="00:00.0";}

/* 抽選 */
let max=40;
function changeMax(n){
  max=Math.max(1,max+n);
  document.getElementById("max").innerText=max.toString().padStart(2," ");
}
function draw(){
  document.getElementById("lottery").innerText=
    Math.floor(Math.random()*max)+1;
}
function resetLot(){document.getElementById("lottery").innerText="-";}

loadData();
</script>

</body>
</html>
