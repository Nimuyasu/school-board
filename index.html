<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>教室表示</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: linear-gradient(135deg,#cfe8ff,#fff3c8);
}

/* 上部 */
.top {
  display: flex;
  align-items: center;
  padding: 10px 20px;
}

select {
  font-size: 28px;
}

button {
  background:#6ea0d6;
  color:white;
  border:none;
  padding:8px 14px;
  margin-left:10px;
  border-radius:8px;
  font-size:18px;
  cursor:pointer;
}

/* 時計 */
.clock {
  text-align:center;
  font-size:120px;
  font-weight:bold;
}

/* 全体レイアウト */
.main {
  display:flex;
  gap:20px;
  padding:10px 20px 20px;
  height:calc(100vh - 160px);
  box-sizing:border-box;
}

/* 日課 */
.schedule {
  flex:1;
  background:white;
  border-radius:15px;
  padding:15px;
  display:flex;
  flex-direction:column;
}

.date {
  font-size:32px;
  font-weight:bold;
  margin-bottom:10px;
}

.row {
  display:flex;
  align-items:center;
  margin:6px 0;
}

.period {
  width:120px;
  font-size:22px;
}

.subject {
  font-size:30px;
  margin-left:10px;
}

.plan {
  margin-top:auto;
  background:#f5e6c0;
  padding:10px;
  border-radius:8px;
  font-size:24px;
}

/* 右 */
.tools {
  width:35%;
  display:flex;
  flex-direction:column;
  gap:15px;
}

.tool {
  background:white;
  border-radius:15px;
  padding:15px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.tool-inner {
  display:flex;
  align-items:center;
  gap:20px;
}

/* タイマー等 */
.time-display {
  font-size:60px;
  font-weight:bold;
  min-width:180px;
  text-align:center;
}

.buttons {
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  justify-content:center;
}

/* 抽選 */
.random-display {
  font-size:60px;
  font-weight:bold;
  min-width:120px;
  text-align:center;
}

.random-max {
  font-size:30px;
  min-width:50px;
  display:inline-block;
}
</style>
</head>

<body>

<div class="top">
<select id="classSelect">
<option>1-1</option><option>1-2</option><option>1-3</option><option>1-4</option>
<option>2-1</option><option>2-2</option><option>2-3</option><option>2-4</option>
<option>3-1</option><option>3-2</option><option>3-3</option><option>3-4</option>
<option>s-1</option><option>s-2</option><option>s-3</option>
<option>a-1</option><option>a-2</option><option>a-3</option>
</select>

<button onclick="loadData()">↻</button>
</div>

<div class="clock" id="clock"></div>

<div class="main">

<!-- 今日 -->
<div class="schedule">
<div class="date" id="todayDate"></div>
<div id="todaySchedule"></div>
<div class="plan" id="todayPlan"></div>
</div>

<!-- 明日 -->
<div class="schedule">
<div class="date" id="nextDate"></div>
<div id="nextSchedule"></div>
<div class="plan" id="nextPlan"></div>
</div>

<!-- ツール -->
<div class="tools">

<!-- タイマー -->
<div class="tool">
<div class="tool-inner">
<div class="time-display" id="timer">00:00</div>
<div class="buttons">
<button onclick="addTime(600)">+10分</button>
<button onclick="addTime(60)">+1分</button>
<button onclick="addTime(10)">+10秒</button>
<button onclick="addTime(1)">+1秒</button>
<button onclick="startTimer()">開始</button>
<button onclick="resetTimer()">リセット</button>
</div>
</div>
</div>

<!-- ストップウォッチ -->
<div class="tool">
<div class="tool-inner">
<div class="time-display" id="stopwatch">00:00.0</div>
<div class="buttons">
<button onclick="startSW()">開始</button>
<button onclick="stopSW()">停止</button>
<button onclick="resetSW()">リセット</button>
</div>
</div>
</div>

<!-- 抽選 -->
<div class="tool">
<div class="tool-inner">
<div>
<span id="randomNumber" class="random-display">-</span>
<span class="random-max"> / <span id="maxNumber">40</span></span>
</div>
<div class="buttons">
<button onclick="changeMax(-10)">-10</button>
<button onclick="changeMax(-1)">-1</button>
<button onclick="changeMax(1)">+1</button>
<button onclick="changeMax(10)">+10</button>
<button onclick="draw()">抽選</button>
<button onclick="resetRandom()">リセット</button>
</div>
</div>
</div>

</div>
</div>

<script>

/* 時計 */
setInterval(()=>{
const now=new Date();
document.getElementById("clock").textContent=
now.toLocaleTimeString("ja-JP",{hour12:false});
},1000);

/* CSV */
let csvData=[];

function parseCSV(text){
const rows=text.trim().split("\n").map(r=>r.split(","));
const headers=rows[0];

return rows.slice(1).map(row=>{
let obj={};
headers.forEach((h,i)=>{
obj[h.trim()]=row[i]?row[i].trim():"";
});
return obj;
});
}

async function loadData(){
const res=await fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vQ6hu2HGH9XN1d3Pj8euPrv49TgqM-GsPJNqge6IiRoqvXpNWuRFteTEufF-ffT5WDpYtG4W25h4bxI/pub?gid=0&single=true&output=csv");
const text=await res.text();
csvData=parseCSV(text);
render();
}

/* 日課取得 */
function getData(date,cls){
return csvData.find(r=>r.date===date && r.class===cls);
}

/* 表示 */
function render(){
const cls=document.getElementById("classSelect").value;
const today=new Date();
const next=new Date(today);
next.setDate(today.getDate()+1);

const tStr=today.toISOString().slice(0,10);
const nStr=next.toISOString().slice(0,10);

document.getElementById("todayDate").textContent=tStr;
document.getElementById("nextDate").textContent=nStr;

showSchedule(getData(tStr,cls),"today");
showSchedule(getData(nStr,cls),"next");
}

function showSchedule(data,type){
const area=document.getElementById(type+"Schedule");
const plan=document.getElementById(type+"Plan");

area.innerHTML="";
plan.textContent="";

if(!data)return;

for(let i=1;i<=6;i++){
const sub=data["p"+i];
const row=document.createElement("div");
row.className="row";
row.innerHTML=`<div class="period">${i}時間目</div>
<div class="subject">${sub||""}</div>`;
area.appendChild(row);
}

plan.textContent=data.plan||"";
}

/* タイマー */
let timer=0,ti=null;

function addTime(s){
timer+=s;
updateTimer();
}

function updateTimer(){
let m=Math.floor(timer/60);
let s=timer%60;
document.getElementById("timer").textContent=
String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

function startTimer(){
if(ti)return;
ti=setInterval(()=>{
timer--;
updateTimer();
if(timer<=0){
timer=0;
clearInterval(ti);
ti=null;
playAlarm();
}
},1000);
}

function resetTimer(){
timer=0;
clearInterval(ti);
ti=null;
updateTimer();
}

/* アラーム */
function playAlarm(){
const ctx=new (window.AudioContext||window.webkitAudioContext)();
let count=0;

function beep(){
const osc=ctx.createOscillator();
const gain=ctx.createGain();
osc.connect(gain);
gain.connect(ctx.destination);

osc.frequency.value=1200;
gain.gain.value=0.2;

osc.start();
osc.stop(ctx.currentTime+0.15);

count++;
if(count<4){
setTimeout(beep,1000);
}
}
beep();
}

/* ストップウォッチ */
let sw=0,swI=null;

function startSW(){
if(swI)return;
swI=setInterval(()=>{
sw+=0.1;
document.getElementById("stopwatch").textContent=
sw.toFixed(1).padStart(6,"0");
},100);
}
function stopSW(){clearInterval(swI);swI=null;}
function resetSW(){sw=0;stopSW();document.getElementById("stopwatch").textContent="00:00.0";}

/* 抽選 */
let max=40;

function changeMax(v){
max+=v;
if(max<1)max=1;
document.getElementById("maxNumber").textContent=max;
}

function draw(){
const n=Math.floor(Math.random()*max)+1;
document.getElementById("randomNumber").textContent=n;
}

function resetRandom(){
document.getElementById("randomNumber").textContent="-";
}

loadData();

</script>

</body>
</html>
