<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>教室表示</title>

<link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">

<style>
html,body{
  margin:0;
  height:100%;
}

body{
  font-family:'Kosugi Maru',sans-serif;
  background:linear-gradient(135deg,#d9f3ff,#fff7d6);
}

/* ===== 全体を16:9に ===== */
.wrapper{
  height:100%;
  display:flex;
  flex-direction:column;
}

/* 上 */
.top{
  text-align:center;
}

.date{
  font-size:1.8vw;
  margin-top:1vh;
}

.clock{
  font-size:8vw;
  font-weight:900;
}

/* メイン */
.main{
  flex:1;
  display:flex;
  gap:1vw;
  padding:1vw;
  box-sizing:border-box;
}

.left{
  flex:2;
  display:flex;
  gap:1vw;
}

.card{
  flex:1;
  background:white;
  border-radius:15px;
  padding:1vw;
}

.header{
  text-align:center;
  font-size:1.6vw;
  margin-bottom:0.5vh;
}

.row{
  display:grid;
  grid-template-columns:30% 70%;
  font-size:1.8vw;
  padding:4px 0;
  align-items:center;
}

.subject{
  padding-left:5px;
}

.plan{
  font-size:1.5vw;
  background:#fff3cd;
  border-radius:8px;
  padding:5px;
  margin-top:5px;
}

/* 右 */
.right{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:0.5vh;
}

.tool{
  flex:1;
  background:white;
  border-radius:15px;
  padding:0.5vw;
  text-align:center;
}

.big{
  font-size:3.5vw;
  font-weight:900;
}

/* ボタン */
button{
  font-size:0.9vw;
  padding:3px 6px;
  margin:1px;
  border:none;
  border-radius:8px;
  background:#6fa8dc;
  color:white;
}
</style>
</head>

<body>

<div class="wrapper">

<div class="top">
  <div class="date" id="date"></div>
  <div class="clock" id="clock"></div>
</div>

<div class="main">

<div class="left">
  <div class="card">
    <div class="header" id="todayHeader"></div>
    <div id="today"></div>
    <div class="plan" id="todayPlan"></div>
  </div>

  <div class="card">
    <div class="header" id="tomorrowHeader"></div>
    <div id="tomorrow"></div>
    <div class="plan" id="tomorrowPlan"></div>
  </div>
</div>

<div class="right">

<div class="tool">
  <div class="big" id="timer">00:00</div>
  <button onclick="addTime(60)">+1分</button>
  <button onclick="addTime(10)">+10秒</button>
  <button onclick="startTimer()">開始</button>
  <button onclick="resetTimer()">リセット</button>
</div>

<div class="tool">
  <div class="big" id="sw">00:00.0</div>
  <button onclick="swStart()">開始</button>
  <button onclick="swStop()">停止</button>
  <button onclick="swReset()">リセット</button>
</div>

<div class="tool">
  <div class="big" id="result">-</div>
  <div id="maxDisplay">40</div>
  <button onclick="changeMax(-1)">-1</button>
  <button onclick="changeMax(1)">+1</button>
  <button onclick="draw()">抽選</button>
</div>

</div>

</div>
</div>

<script>
const SHEET_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ6hu2HGH9XN1d3Pj8euPrv49TgqM-GsPJNqge6IiRoqvXpNWuRFteTEufF-ffT5WDpYtG4W25h4bxI/pub?gid=0&single=true&output=csv";

let cache=null;

/* 時計（軽量） */
setInterval(()=>{
  const n=new Date();
  clock.textContent=n.toLocaleTimeString('ja-JP');
  date.textContent=n.toLocaleDateString('ja-JP',{year:'numeric',month:'numeric',day:'numeric',weekday:'short'});
},1000);

/* CSVキャッシュ */
async function fetchData(){
  if(cache) return cache;

  const res=await fetch(SHEET_URL);
  const text=await res.text();
  const rows=text.split("\n");

  let data={};

  for(let r of rows){
    const c=r.split(",");
    if(c.length<10) continue;

    const key=c[0];
    data[key]=c.slice(2);
  }

  cache=data;
  return data;
}

function getKey(d){
  return d.toISOString().slice(0,10);
}

function render(id,row){
  let h="";
  for(let i=0;i<6;i++){
    h+=`<div class="row"><div>${i+1}</div><div>${row[i]||""}</div></div>`;
  }
  document.getElementById(id).innerHTML=h;
}

async function load(){
  const all=await fetchData();

  const t=new Date();
  const key=getKey(t);

  if(all[key]){
    render("today",all[key]);
    todayHeader.textContent=t.toLocaleDateString('ja-JP',{month:'numeric',day:'numeric',weekday:'short'});
    todayPlan.textContent=all[key][7]||"";
  }

  let d=new Date();
  for(let i=0;i<30;i++){
    d.setDate(d.getDate()+1);
    const k=getKey(d);
    if(all[k]){
      render("tomorrow",all[k]);
      tomorrowHeader.textContent=d.toLocaleDateString('ja-JP',{month:'numeric',day:'numeric',weekday:'short'});
      tomorrowPlan.textContent=all[k][7]||"";
      break;
    }
  }
}

load();

/* タイマー（多重防止） */
let t=0,ti=null;
function startTimer(){
  if(ti) return;
  ti=setInterval(()=>{
    if(t<=0){clearInterval(ti);ti=null;return;}
    t--;
    timer.textContent=Math.floor(t/60)+":"+String(t%60).padStart(2,'0');
  },1000);
}
function resetTimer(){clearInterval(ti);ti=null;t=0;timer.textContent="00:00";}
function addTime(s){t+=s;}

/* SW */
let swt=0,swi=null;
function swStart(){if(swi)return;swi=setInterval(()=>{swt++;sw.textContent=swt/10;},100);}
function swStop(){clearInterval(swi);swi=null;}
function swReset(){swStop();swt=0;sw.textContent="0";}

/* 抽選 */
let max=40;
function changeMax(n){max+=n;if(max<1)max=1;maxDisplay.textContent=max;}
function draw(){result.textContent=Math.floor(Math.random()*max)+1;}
</script>

</body>
</html>
