<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>教室表示</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  overflow:hidden;
  font-family:'Noto Sans JP',sans-serif;
}

/* ===== 背景 ===== */
#wrapper{
  width:100vw;
  height:100vh;
  background:linear-gradient(135deg,#d9f3ff,#fff7d6);
  display:flex;
  justify-content:center;
  align-items:center;
}

#app{
  width:1920px;
  height:1080px;
  transform-origin:center;
}

/* ===== 時計 ===== */
.top{
  height:22%;
  display:flex;
  align-items:center;
  justify-content:center;
}
#clock{
  font-size:18vh;
}

/* ===== クラス ===== */
#control{
  position:absolute;
  top:10px;
  left:10px;
}
#cls{
  font-size:4vh; /* ←2倍 */
}
#control button{
  font-size:3vh;
}

/* ===== メイン ===== */
.main{
  display:flex;
  height:78%;
  gap:6px;
  padding:6px;
  box-sizing:border-box;
}

/* ===== 日課 ===== */
.card{
  flex:0 0 28%;
  background:white;
  border-radius:12px;
  padding:10px;
  display:flex;
  flex-direction:column;
}

.header{
  font-size:5vh;
  text-align:center;
}

.row{
  display:flex;
  align-items:center;
  margin:6px 0;
}

.period{
  width:5em;
  font-size:3vh;
  padding-left:10px;
}

.subject{
  flex:1;
  font-size:5vh;
  padding-left:20px;
}
.subject:empty::before{content:"　";}

.plan{
  font-size:4vh;
  background:#fff3cd;
  margin-top:auto;
  padding:6px;
  word-break:break-word;
}

/* ===== 右 ===== */
.right{
  flex:0 0 44%;
  display:flex;
  flex-direction:column;
  gap:6px;
}

.tool{
  flex:1;
  background:white;
  border-radius:12px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:20px;
}

/* 数字 */
.big{
  font-size:8vh;
  width:260px;
  text-align:center;
}

/* ボタン */
.buttons{
  display:flex;
  flex-direction:column;
  align-items:center;
}
.btn-row{
  display:flex;
  justify-content:center;
}
button{
  margin:3px;
  padding:6px 10px;
  font-size:3vh;
  border:none;
  border-radius:8px;
  background:#6fa8dc;
  color:white;
}

/* 抽選 */
.draw{
  display:flex;
  align-items:center;
  gap:10px;
}
.max{
  width:60px;
  font-size:3vh;
}
</style>
</head>

<body>

<div id="wrapper">
<div id="app">

<div id="control">
<select id="cls"></select>
<button onclick="reload()">⟳</button>
</div>

<div class="top">
<div id="clock"></div>
</div>

<div class="main">

<!-- 今日 -->
<div class="card">
<div class="header" id="todayH"></div>
<div id="today"></div>
<div class="plan" id="todayP"></div>
</div>

<!-- 明日 -->
<div class="card">
<div class="header" id="tomorrowH"></div>
<div id="tomorrow"></div>
<div class="plan" id="tomorrowP"></div>
</div>

<!-- 右 -->
<div class="right">

<!-- タイマー -->
<div class="tool">
<div class="big" id="timer">00:00</div>
<div class="buttons">
<div class="btn-row">
<button onclick="add(600)">＋10分</button>
<button onclick="add(60)">＋1分</button>
</div>
<div class="btn-row">
<button onclick="add(10)">＋10秒</button>
<button onclick="add(1)">＋1秒</button>
</div>
<div class="btn-row">
<button onclick="startTimer()">開始</button>
<button onclick="resetTimer()">リセット</button>
</div>
</div>
</div>

<!-- SW -->
<div class="tool">
<div class="big" id="sw">00:00.0</div>
<div class="buttons">
<div class="btn-row">
<button onclick="startSW()">開始</button>
<button onclick="stopSW()">停止</button>
<button onclick="resetSW()">リセット</button>
</div>
</div>
</div>

<!-- 抽選 -->
<div class="tool">
<div class="draw">
<div class="big" id="res">-</div>
<div class="max">/ <span id="max">40</span></div>
</div>
<div class="buttons">
<div class="btn-row">
<button onclick="chg(-10)">-10</button>
<button onclick="chg(-1)">-1</button>
<button onclick="chg(1)">+1</button>
<button onclick="chg(10)">+10</button>
</div>
<div class="btn-row">
<button onclick="draw()">抽選</button>
<button onclick="resetR()">リセット</button>
</div>
</div>
</div>

</div>
</div>

</div>
</div>

<script>
/* フィット */
function fit(){
const scale=Math.min(window.innerWidth/1920,window.innerHeight/1080);
app.style.transform=`scale(${scale})`;
}
window.addEventListener("resize",fit);
fit();

/* クラス */
const list=[
"1-1","1-2","1-3","1-4",
"2-1","2-2","2-3","2-4",
"3-1","3-2","3-3","3-4",
"s-1","s-2","s-3",
"a-1","a-2","a-3"
];
list.forEach(c=>cls.innerHTML+=`<option>${c}</option>`);
let current="3-1";

/* 時計 */
setInterval(()=>clock.textContent=new Date().toLocaleTimeString(),1000);

/* CSV */
const URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ6hu2HGH9XN1d3Pj8euPrv49TgqM-GsPJNqge6IiRoqvXpNWuRFteTEufF-ffT5WDpYtG4W25h4bxI/pub?gid=0&single=true&output=csv";

async function get(){
const t=await fetch(URL);
const tx=await t.text();
const rows=tx.split("\n");
let data={};
rows.forEach(r=>{
let c=r.split(",");
if(c.length<10)return;
if(c[1]!=current)return;
data[c[0]]=c;
});
return data;
}

function key(d){return d.toISOString().split("T")[0];}

async function load(){
const data=await get();
today.innerHTML=""; tomorrow.innerHTML="";
todayP.textContent=""; tomorrowP.textContent="";

let now=new Date();
let k=key(now);

if(data[k]){
draw(today,data[k]);
todayH.textContent=k;
todayP.textContent=data[k][9]||"";
}

/* 次の登校日 */
let d=new Date(now);
for(let i=0;i<10;i++){
d.setDate(d.getDate()+1);
let kk=key(d);
if(data[kk] && data[kk].slice(2,8).some(v=>v)){
draw(tomorrow,data[kk]);
tomorrowH.textContent=kk;
tomorrowP.textContent=data[kk][9]||"";
break;
}
}
}

function draw(el,row){
let h="";
for(let i=2;i<=7;i++){
h+=`<div class="row">
<div class="period">${i-1}時間目</div>
<div class="subject">${row[i]||""}</div>
</div>`;
}
el.innerHTML=h;
}

function reload(){current=cls.value; load();}
load();

/* ===== タイマー ===== */
let t=0,ti;
function add(s){t+=s;disp();}
function disp(){
let m=String(Math.floor(t/60)).padStart(2,'0');
let s=String(t%60).padStart(2,'0');
timer.textContent=`${m}:${s}`;
}
function beep(){
let ctx=new AudioContext();
for(let i=0;i<4;i++){
setTimeout(()=>{
let o=ctx.createOscillator();
o.frequency.value=1500;
o.connect(ctx.destination);
o.start();
setTimeout(()=>o.stop(),100);
},i*200);
}
}
function startTimer(){
if(ti)return;
ti=setInterval(()=>{
if(t<=0){clearInterval(ti);ti=null;beep();return;}
t--;disp();
},1000);
}
function resetTimer(){clearInterval(ti);ti=null;t=0;disp();}

/* ===== SW ===== */
let swt=0,swi;
function startSW(){
if(swi)return;
swi=setInterval(()=>{
swt++;
let m=Math.floor(swt/600);
let s=Math.floor((swt%600)/10);
let ms=swt%10;
sw.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${ms}`;
},100);
}
function stopSW(){clearInterval(swi);swi=null;}
function resetSW(){stopSW();swt=0;sw.textContent="00:00.0";}

/* ===== 抽選 ===== */
let maxN=40;
function chg(n){maxN+=n;if(maxN<1)maxN=1;max.textContent=maxN;}
function draw(){res.textContent=Math.floor(Math.random()*maxN)+1;}
function resetR(){res.textContent="-";}
</script>

</body>
</html>
