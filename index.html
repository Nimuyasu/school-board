<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>教室表示</title>

<link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden; /* ←スクロール禁止 */
}

body{
  font-family:'Kosugi Maru',sans-serif;
  background:linear-gradient(135deg,#d9f3ff,#fff7d6);
}

/* 上部 */
.top{
  text-align:center;
  height:18vh;
}

.date{
  font-size:2vw;
  margin-top:1vh;
}

.clock{
  font-size:9vw;
  font-weight:900;
}

/* 左上 */
#topLeft{
  position:absolute;
  left:20px;
  top:10px;
}

#classSelect{
  font-size:1.8vw;
}

.iconBtn{
  font-size:1.8vw;
}

/* メイン */
.main{
  display:flex;
  height:82vh; /* ←固定 */
  padding:1vw;
  gap:1vw;
}

.left{
  flex:2;
  display:flex;
  gap:1vw;
}

.card{
  flex:1;
  background:white;
  border-radius:15px;
  padding:1vw;
}

.header{
  text-align:center;
  font-size:1.8vw;
}

.type{
  font-size:1.2vw;
  color:#666;
}

/* 日課 */
.row{
  display:grid;
  grid-template-columns:30% 70%;
  font-size:2vw;
  align-items:center;
  height:5vh; /* ←高さ固定 */
}

.row div:first-child{
  font-size:1.2vw;
}

/* 予定 */
.plan{
  font-size:1.8vw;
  background:#fff3cd;
  margin-top:1vh;
  padding:5px;
}

/* 右 */
.right{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:1vh;
}

.tool{
  flex:1;
  background:white;
  border-radius:15px;
  padding:0.5vw;
  text-align:center;
}

.big{
  font-size:4vw;
}

button{
  font-size:0.9vw;
}
</style>
</head>

<body>

<div id="topLeft">
  <select id="classSelect"></select>
  <button onclick="reloadData()">⟳</button>
</div>

<div class="top">
  <div id="date"></div>
  <div id="clock"></div>
</div>

<div class="main">

<div class="left">
  <div class="card">
    <div id="todayHeader"></div>
    <div id="today"></div>
    <div id="todayPlan"></div>
  </div>

  <div class="card">
    <div id="tomorrowHeader"></div>
    <div id="tomorrow"></div>
    <div id="tomorrowPlan"></div>
  </div>
</div>

<div class="right">
  <div class="tool">
    <div class="big" id="timer">00:00</div>
  </div>
</div>

</div>

<script>
// ===== 日本時間の日付関数 =====
function getJPDateKey(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

const SHEET_URL="あなたのURL";

const classList=["3-1"];
let classId="3-1";

classList.forEach(c=>{
  classSelect.innerHTML+=`<option>${c}</option>`;
});

function reloadData(){
  classId=classSelect.value;
  load();
}

// 時計
setInterval(()=>{
  const n=new Date();
  clock.textContent=n.toLocaleTimeString('ja-JP');
  date.textContent=n.toLocaleDateString('ja-JP',{year:'numeric',month:'numeric',day:'numeric',weekday:'short'});
},1000);

// データ取得
async function fetchData(){
  const res=await fetch(SHEET_URL);
  const text=await res.text();
  const rows=text.split("\n");

  let data={};

  for(let r of rows){
    if(!r.trim()) continue;

    const c=r.split(",");
    if(c[1]!==classId) continue;

    data[c[0]]=c.slice(2);
  }

  return data;
}

// 表示
function render(id,row){
  let h="";
  for(let i=0;i<6;i++){
    const sub=row[i]||"";
    h+=`<div class="row"><div>${sub?i+1+"時間目":""}</div><div>${sub}</div></div>`;
  }
  document.getElementById(id).innerHTML=h;
}

// メイン
async function load(){
  const all=await fetchData();

  const today=new Date();
  const key=getJPDateKey(today);

  if(all[key]){
    render("today",all[key]);
    todayHeader.textContent=key;
    todayPlan.textContent=all[key][7]||"";
  }

  let d=new Date();
  for(let i=0;i<40;i++){
    d.setDate(d.getDate()+1);
    const k=getJPDateKey(d);

    if(all[k]){
      render("tomorrow",all[k]);
      tomorrowHeader.textContent=k;
      tomorrowPlan.textContent=all[k][7]||"";
      break;
    }
  }
}

load();
</script>

</body>
</html>
