<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>教室表示</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Noto Sans JP',sans-serif;
  background:linear-gradient(135deg,#d9f3ff,#fff7d6);
  overflow:hidden;
}

/* 上（時間だけ） */
.top{
  height:25vh; /* ← 1/4使用 */
  display:flex;
  justify-content:center;
  align-items:center;
}
.clock{
  font-size:20vh; /* ← 超巨大 */
  font-weight:700;
}

/* クラス */
#control{
  position:absolute;
  top:10px;
  left:10px;
}
select,button{
  font-size:2vh;
}

/* メイン */
.main{
  display:flex;
  height:75vh;
}

/* 日課（幅を縮める） */
.card{
  flex:1.3; /* ← 小さく */
  margin:5px;
  background:white;
  border-radius:15px;
  padding:10px;
}

.header{
  font-size:3.5vh;
  text-align:center;
  font-weight:700;
}

.row{
  font-size:3.2vh;
  margin:6px 0;
}

.plan{
  font-size:3.2vh;
  background:#fff3cd;
  margin-top:10px;
  padding:5px;
}

/* 右（広げる） */
.right{
  flex:1.7; /* ← 広く */
  display:flex;
  flex-direction:column;
}

/* ツール */
.tool{
  flex:1;
  background:white;
  margin:5px;
  border-radius:15px;
  text-align:center;
  padding:8px;
}

.big{
  font-size:7vh; /* ← 大きく */
  font-weight:700;
}

button{
  margin:4px;
  padding:8px 10px;
  font-size:2vh;
  border:none;
  border-radius:8px;
  background:#6fa8dc;
  color:white;
}
</style>
</head>

<body>

<div id="control">
<select id="cls"></select>
<button onclick="reload()">更新</button>
</div>

<div class="top">
<div id="clock"></div>
</div>

<div class="main">

<div class="card">
<div class="header" id="todayH"></div>
<div id="today"></div>
<div class="plan" id="todayP"></div>
</div>

<div class="card">
<div class="header" id="tomorrowH"></div>
<div id="tomorrow"></div>
<div class="plan" id="tomorrowP"></div>
</div>

<div class="right">

<div class="tool">
<div class="big" id="timer">00:00</div>
<button onclick="add(600)">＋10分</button>
<button onclick="add(60)">＋1分</button>
<button onclick="add(10)">＋10秒</button>
<button onclick="add(1)">＋1秒</button><br>
<button onclick="startT()">開始</button>
<button onclick="resetT()">リセット</button>
</div>

<div class="tool">
<div class="big" id="sw">00:00.0</div>
<button onclick="startSW()">開始</button>
<button onclick="stopSW()">停止</button>
<button onclick="resetSW()">リセット</button>
</div>

<div class="tool">
<div class="big" id="res">-</div>
<div id="max">40</div>
<button onclick="chg(-10)">-10</button>
<button onclick="chg(-1)">-1</button>
<button onclick="chg(1)">+1</button>
<button onclick="chg(10)">+10</button><br>
<button onclick="draw()">抽選</button>
<button onclick="resetR()">リセット</button>
</div>

</div>
</div>

<script>
const URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ6hu2HGH9XN1d3Pj8euPrv49TgqM-GsPJNqge6IiRoqvXpNWuRFteTEufF-ffT5WDpYtG4W25h4bxI/pub?gid=0&single=true&output=csv";

const list=["1-1","1-2","1-3","1-4","2-1","2-2","2-3","2-4","3-1","3-2","3-3","3-4"];
list.forEach(c=>cls.innerHTML+=`<option>${c}</option>`);

let current="3-1";

/* 時計 */
setInterval(()=>{
const d=new Date();
clock.textContent=d.toLocaleTimeString();
},1000);

/* CSV */
async function get(){
const t=await fetch(URL);
const tx=await t.text();
const rows=tx.split("\n");

let data={};

rows.forEach(r=>{
let c=r.split(",");
if(c.length<10)return;
if(c[1]!=current)return;
data[c[0]]=c;
});

return data;
}

function key(d){
return d.toISOString().split("T")[0];
}

function makeHeader(d,type){
const w=["日","月","火","水","木","金","土"];
return `${d.getMonth()+1}/${d.getDate()}(${w[d.getDay()]})　${type||""}`;
}

function drawTable(id,row){
let h="";
for(let i=2;i<=7;i++){
h+=`<div class="row">${i-1}時間目　${row[i]||""}</div>`;
}
document.getElementById(id).innerHTML=h;
}

async function load(){
today.innerHTML="";
tomorrow.innerHTML="";
todayP.textContent="";
tomorrowP.textContent="";

const data=await get();

const t=new Date();
const k=key(t);

if(data[k]){
drawTable("today",data[k]);
todayH.textContent=makeHeader(t,data[k][8]);
todayP.textContent=data[k][9]||"";
}

let d=new Date();
for(let i=0;i<7;i++){
d.setDate(d.getDate()+1);
if(d.getDay()==0||d.getDay()==6)continue;

const kk=key(d);
if(data[kk]){
drawTable("tomorrow",data[kk]);
tomorrowH.textContent=makeHeader(d,data[kk][8]);
tomorrowP.textContent=data[kk][9]||"";
break;
}
}
}

function reload(){
current=cls.value;
load();
}

load();

/* タイマー */
let t=0,ti;
function add(s){t+=s;if(t<0)t=0;timer.textContent=format(t);}
function startT(){
if(ti)return;
ti=setInterval(()=>{
if(t<=0){clearInterval(ti);ti=null;return;}
t--;timer.textContent=format(t);
},1000);
}
function resetT(){clearInterval(ti);ti=null;t=0;timer.textContent="00:00";}
function format(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,'0');}

/* SW */
let swt=0,swi;
function startSW(){
if(swi)return;
swi=setInterval(()=>{
swt++;
let m=Math.floor(swt/600);
let s=Math.floor((swt%600)/10);
let ms=swt%10;
sw.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${ms}`;
},100);
}
function stopSW(){clearInterval(swi);swi=null;}
function resetSW(){stopSW();swt=0;sw.textContent="00:00.0";}

/* 抽選 */
let maxN=40;
function chg(n){maxN+=n;if(maxN<1)maxN=1;max.textContent=maxN;}
function draw(){res.textContent=Math.floor(Math.random()*maxN)+1;}
function resetR(){res.textContent="-";}
</script>

</body>
</html>
