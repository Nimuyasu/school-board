<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>教室表示</title>

<link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">

<style>
html,body{margin:0;height:100%;}
body{
  font-family:'Kosugi Maru',sans-serif;
  background:linear-gradient(135deg,#d9f3ff,#fff7d6);
  background-attachment:fixed;
}

/* 左上 */
#topLeft{
  position:absolute;
  left:20px;
  top:10px;
  display:flex;
  gap:8px;
}

#classSelect{
  font-size:2vw;
  border:none;
  background:transparent;
}

.iconBtn{
  width:34px;height:34px;border:none;border-radius:50%;
  background:#6fa8dc;color:white;font-size:18px;cursor:pointer;
}

/* 上 */
.top{text-align:center;}
.date{font-size:2.2vw;padding-top:15px;}
.clock{font-size:11vw;font-weight:900;}

/* レイアウト */
.main{
  display:flex;
  min-height:78vh;
  gap:1vw;
  padding:1vw;
}

.left{flex:2;display:flex;gap:1vw;}

.card{
  flex:1;
  background:white;
  border-radius:20px;
  padding:1.2vw;
}

.header{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  font-size:2vw;
}

.scheduleType{
  font-size:1.4vw;
  color:#555;
}

/* 行 */
.row{
  display:grid;
  grid-template-columns:30% 70%;
  font-size:2.6vw;
  align-items:center;
  padding:8px 0;
  min-height:2.8vw; /* ←高さ固定 */
}

.row div:first-child{
  font-size:1.5vw;
}

.subject{
  min-height:2.8vw; /* ←空欄でも高さ維持 */
}

/* 予定 */
.plan{
  font-size:2.2vw;
  background:#fff3cd;
  border-radius:10px;
  padding:6px;
  margin-top:8px;
}

/* 右 */
.right{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:1vh;
}

.tool{
  flex:1;
  background:white;
  border-radius:20px;
  padding:0.7vw;
  text-align:center;
}

.big{
  font-size:5vw;
  font-weight:900;
}

button{
  border:none;
  border-radius:12px;
  padding:4px 8px;
  margin:2px;
  font-size:1vw;
  background:linear-gradient(135deg,#74ebd5,#9face6);
  color:white;
}
</style>
</head>

<body>

<div id="topLeft">
  <select id="classSelect"></select>
  <button class="iconBtn" onclick="reloadData()">⟳</button>
</div>

<div class="top">
  <div class="date" id="date"></div>
  <div class="clock" id="clock"></div>
</div>

<div class="main">

<div class="left">
  <div class="card">
    <div class="header">
      <span id="todayHeader"></span>
      <span class="scheduleType" id="todayType"></span>
    </div>
    <div id="today"></div>
    <div class="plan" id="todayPlan"></div>
  </div>

  <div class="card">
    <div class="header">
      <span id="tomorrowHeader"></span>
      <span class="scheduleType" id="tomorrowType"></span>
    </div>
    <div id="tomorrow"></div>
    <div class="plan" id="tomorrowPlan"></div>
  </div>
</div>

<div class="right">

<div class="tool">
  <div class="big" id="timer">00:00</div>
  <button onclick="addTime(600)">+10分</button>
  <button onclick="addTime(60)">+1分</button>
  <button onclick="addTime(10)">+10秒</button>
  <button onclick="addTime(1)">+1秒</button><br>
  <button onclick="startTimer()">開始</button>
  <button onclick="resetTimer()">リセット</button>
</div>

<div class="tool">
  <div class="big" id="sw">00:00.0</div>
  <button onclick="swStart()">開始</button>
  <button onclick="swStop()">停止</button>
  <button onclick="swReset()">リセット</button>
</div>

<div class="tool">
  <div class="big" id="result">-</div>
  <div id="maxDisplay">最大：40</div>
  <button onclick="changeMax(-10)">-10</button>
  <button onclick="changeMax(-1)">-1</button>
  <button onclick="changeMax(1)">+1</button>
  <button onclick="changeMax(10)">+10</button><br>
  <button onclick="draw()">抽選</button>
  <button onclick="resetDraw()">リセット</button>
</div>

</div>
</div>

<script>
const SHEET_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ6hu2HGH9XN1d3Pj8euPrv49TgqM-GsPJNqge6IiRoqvXpNWuRFteTEufF-ffT5WDpYtG4W25h4bxI/pub?output=csv";

const classList=["1-1","1-2","1-3","1-4","2-1","2-2","2-3","2-4","3-1","3-2","3-3","3-4","s-1","s-2","s-3","a-1","a-2","a-3"];

let classId="3-1";

classList.forEach(c=>{
  classSelect.innerHTML+=`<option value="${c}">${c}</option>`;
});

function reloadData(){
  classId=classSelect.value;
  load();
}

/* 時計 */
setInterval(()=>{
  const n=new Date();
  clock.textContent=n.toLocaleTimeString('ja-JP');
  date.textContent=n.getFullYear()+"年"+(n.getMonth()+1)+"月"+n.getDate()+"日（"+
  ["日","月","火","水","木","金","土"][n.getDay()]+"）";
},1000);

/* データ取得 */
async function fetchData(){
  const res=await fetch(SHEET_URL);
  const text=await res.text();

  const rows=text.split("\n");
  let data={};

  for(let r of rows){
    if(!r.trim()) continue;
    const cols=r.split(",");
    if(cols.length<10) continue;

    const date=cols[0];
    const cls=cols[1];

    if(cls!==classId) continue;

    data[date]=cols.slice(2);
  }
  return data;
}

/* 表示 */
function render(id,row){
  let h="";
  for(let i=0;i<6;i++){
    h+=`<div class="row"><div>${i+1}時間目</div><div class="subject">${row[i]||""}</div></div>`;
  }
  document.getElementById(id).innerHTML=h;
}

/* メイン */
async function load(){
  const all=await fetchData();

  today.innerHTML="";
  tomorrow.innerHTML="";
  todayPlan.textContent="";
  tomorrowPlan.textContent="";
  todayHeader.textContent="";
  tomorrowHeader.textContent="";
  todayType.textContent="";
  tomorrowType.textContent="";

  const t=new Date();
  const key=t.toISOString().slice(0,10);

  if(all[key]){
    render("today",all[key]);
    todayHeader.textContent=t.toLocaleDateString('ja-JP',{month:'numeric',day:'numeric',weekday:'short'});
    todayType.textContent=all[key][6]||"";
    todayPlan.textContent=all[key][7]||"";
  }

  let d=new Date();
  for(let i=0;i<40;i++){
    d.setDate(d.getDate()+1);
    const k=d.toISOString().slice(0,10);
    if(all[k]){
      render("tomorrow",all[k]);
      tomorrowHeader.textContent=d.toLocaleDateString('ja-JP',{month:'numeric',day:'numeric',weekday:'short'});
      tomorrowType.textContent=all[k][6]||"";
      tomorrowPlan.textContent=all[k][7]||"";
      break;
    }
  }
}

load();
</script>

</body>
</html>
