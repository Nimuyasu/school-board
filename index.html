<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>教室表示</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Noto Sans JP',sans-serif;
  background:linear-gradient(135deg,#d9f3ff,#fff7d6);
  overflow:hidden;
}

/* 上部（時計） */
.top{
  height:22vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
#clock{
  font-size:12vh;
  font-weight:700;
}

/* クラス */
#control{
  position:absolute;
  top:10px;
  left:10px;
}

/* メイン */
.main{
  display:flex;
  height:78vh;
}

/* 日課 */
.card{
  flex:1.2;
  margin:6px;
  background:white;
  border-radius:12px;
  padding:10px;
}

.header{
  font-size:2.8vh;
  text-align:center;
  font-weight:700;
}

.row{
  display:flex;
  align-items:center;
  margin:6px 0;
}

.period{
  width:5em;
  font-size:1.6vh;
}

.subject{
  flex:1;
  font-size:2.8vh;
  min-height:1.2em;
}
.subject:empty::before{
  content:"　";
}

.plan{
  font-size:2.4vh;
  background:#fff3cd;
  margin-top:6px;
  padding:5px;
}

/* 右 */
.right{
  flex:1.5;
  display:flex;
  flex-direction:column;
}

.tool{
  flex:1;
  background:white;
  margin:4px;
  border-radius:12px;
  text-align:center;
  padding:6px;
}

.big{
  font-size:4.5vh;
  font-weight:700;
}

button{
  margin:2px;
  padding:4px 6px;
  font-size:1.6vh;
  border:none;
  border-radius:6px;
  background:#6fa8dc;
  color:white;
}

/* 抽選 */
.drawTop{
  display:flex;
  justify-content:center;
  align-items:baseline;
  gap:6px;
}
.max{
  font-size:2vh;
}
</style>
</head>

<body>

<div id="control">
<select id="cls"></select>
<button onclick="reload()">⟳</button>
</div>

<div class="top">
<div id="clock"></div>
</div>

<div class="main">

<div class="card">
<div class="header" id="todayH"></div>
<div id="today"></div>
<div class="plan" id="todayP"></div>
</div>

<div class="card">
<div class="header" id="tomorrowH"></div>
<div id="tomorrow"></div>
<div class="plan" id="tomorrowP"></div>
</div>

<div class="right">

<div class="tool">
<div class="big" id="timer">00:00</div>
<button onclick="add(600)">＋10分</button>
<button onclick="add(60)">＋1分</button>
<button onclick="add(10)">＋10秒</button>
<button onclick="add(1)">＋1秒</button><br>
<button onclick="startT()">開始</button>
<button onclick="resetT()">リセット</button>
</div>

<div class="tool">
<div class="big" id="sw">00:00.0</div>
<button onclick="startSW()">開始</button>
<button onclick="stopSW()">停止</button>
<button onclick="resetSW()">リセット</button>
</div>

<div class="tool">
<div class="drawTop">
  <div class="big" id="res">-</div>
  <div class="max">/ <span id="max">40</span></div>
</div>
<button onclick="chg(-10)">-10</button>
<button onclick="chg(-1)">-1</button>
<button onclick="chg(1)">+1</button>
<button onclick="chg(10)">+10</button><br>
<button onclick="draw()">抽選</button>
<button onclick="resetR()">リセット</button>
</div>

</div>
</div>

<script>
const URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ6hu2HGH9XN1d3Pj8euPrv49TgqM-GsPJNqge6IiRoqvXpNWuRFteTEufF-ffT5WDpYtG4W25h4bxI/pub?gid=0&single=true&output=csv";

const list=["1-1","1-2","1-3","1-4","2-1","2-2","2-3","2-4","3-1","3-2","3-3","3-4"];
list.forEach(c=>cls.innerHTML+=`<option>${c}</option>`);

let current="3-1";

/* 時計 */
setInterval(()=>{
clock.textContent=new Date().toLocaleTimeString();
},1000);

/* CSV */
async function get(){
const t=await fetch(URL);
const tx=await t.text();
const rows=tx.split("\n");

let data={};
rows.forEach(r=>{
let c=r.split(",");
if(c.length<10)return;
if(c[1]!=current)return;
data[c[0]]=c;
});
return data;
}

function key(d){
return d.toISOString().split("T")[0];
}

function makeHeader(d,type){
const w=["日","月","火","水","木","金","土"];
return `${d.getMonth()+1}/${d.getDate()}(${w[d.getDay()]})　${type||""}`;
}

function drawTable(id,row){
let h="";
for(let i=2;i<=7;i++){
h+=`
<div class="row">
  <div class="period">${i-1}時間目</div>
  <div class="subject">${row[i]||""}</div>
</div>`;
}
document.getElementById(id).innerHTML=h;
}

async function load(){
const data=await get();
const t=new Date();
const k=key(t);

if(data[k]){
drawTable("today",data[k]);
todayH.textContent=makeHeader(t,data[k][8]);
todayP.textContent=data[k][9]||"";
}
}

function reload(){
current=cls.value;
load();
}

load();

/* 🔔 音（指定どおり） */
const ctx=new (window.AudioContext||window.webkitAudioContext)();

function beep(){
const o=ctx.createOscillator();
const g=ctx.createGain();
o.frequency.value=1200;
o.connect(g);
g.connect(ctx.destination);
o.start();
g.gain.setValueAtTime(1,ctx.currentTime);
g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.1);
o.stop(ctx.currentTime+0.1);
}

function alarm(){
let count=0;
let interval=setInterval(()=>{
for(let i=0;i<4;i++){
setTimeout(beep,i*120); // ピピピピ（高速）
}
count++;
if(count>=4) clearInterval(interval); // 4回
},1000);
}

/* タイマー */
let t=0,ti;
function format(s){
return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
}
function add(s){t+=s;timer.textContent=format(t);}
function startT(){
if(ti)return;
ti=setInterval(()=>{
if(t<=0){
clearInterval(ti);
ti=null;
alarm();
return;
}
t--;
timer.textContent=format(t);
},1000);
}
function resetT(){clearInterval(ti);ti=null;t=0;timer.textContent="00:00";}

/* SW */
let swt=0,swi;
function startSW(){
if(swi)return;
swi=setInterval(()=>{
swt++;
let m=Math.floor(swt/600);
let s=Math.floor((swt%600)/10);
let ms=swt%10;
sw.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${ms}`;
},100);
}
function stopSW(){clearInterval(swi);swi=null;}
function resetSW(){stopSW();swt=0;sw.textContent="00:00.0";}

/* 抽選 */
let maxN=40;
function chg(n){maxN+=n;if(maxN<1)maxN=1;max.textContent=maxN;}
function draw(){res.textContent=Math.floor(Math.random()*maxN)+1;}
function resetR(){res.textContent="-";}
</script>

</body>
</html>
