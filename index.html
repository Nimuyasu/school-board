でも「確実に動く」こと最優先
テレビでも安定
🖥️ 完全修正版（これでダメなら原因切り分けできます）
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>教室表示</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Noto Sans JP',sans-serif;
  background:linear-gradient(135deg,#d9f3ff,#fff7d6);
  overflow:hidden;
}

/* 🔥 時刻（絶対配置に変更） */
#clock{
  position:absolute;
  top:1vh;
  left:50%;
  transform:translateX(-50%);
  font-size:18vw; /* ← 強制的に巨大 */
  font-weight:700;
  line-height:1;
}

/* メイン */
.main{
  position:absolute;
  top:22vh; /* ← 時計の下に配置 */
  left:0;
  width:100%;
  height:78vh;
  display:flex;
}

/* 日課 */
.card{
  flex:1.2;
  margin:6px;
  background:white;
  border-radius:12px;
  padding:10px;
}

.header{
  font-size:2.5vw;
  text-align:center;
  font-weight:700;
}

.row{
  display:flex;
  align-items:center;
  margin:8px 0;
}

.period{
  width:6em;
  font-size:1.6vw;
}

.subject{
  flex:1;
  font-size:2.8vw;
  min-height:1.2em;
}

/* 空欄でも高さ維持 */
.subject:empty::before{
  content:"　";
}

.plan{
  font-size:2.3vw;
  background:#fff3cd;
  margin-top:8px;
  padding:6px;
}

/* 右 */
.right{
  flex:1.6;
  display:flex;
  flex-direction:column;
}

.tool{
  flex:1;
  background:white;
  margin:3px;
  border-radius:12px;
  text-align:center;
  padding:6px;
}

.big{
  font-size:4vw;
  font-weight:700;
}

button{
  margin:2px;
  padding:4px 6px;
  font-size:1.2vw;
  border:none;
  border-radius:6px;
  background:#6fa8dc;
  color:white;
}

/* 抽選 */
.drawTop{
  display:flex;
  justify-content:center;
  align-items:baseline;
}
.max{
  font-size:2vw;
  margin-left:6px;
}
</style>
</head>

<body>

<div id="clock"></div>

<div class="main">

<div class="card">
<div class="header" id="todayH"></div>
<div id="today"></div>
<div class="plan" id="todayP"></div>
</div>

<div class="card">
<div class="header" id="tomorrowH"></div>
<div id="tomorrow"></div>
<div class="plan" id="tomorrowP"></div>
</div>

<div class="right">

<div class="tool">
<div class="big" id="timer">00:00</div>
<button onclick="add(600)">＋10分</button>
<button onclick="add(60)">＋1分</button>
<button onclick="add(10)">＋10秒</button>
<button onclick="add(1)">＋1秒</button><br>
<button onclick="startT()">開始</button>
<button onclick="resetT()">リセット</button>
</div>

<div class="tool">
<div class="big" id="sw">00:00.0</div>
<button onclick="startSW()">開始</button>
<button onclick="stopSW()">停止</button>
<button onclick="resetSW()">リセット</button>
</div>

<div class="tool">
<div class="drawTop">
  <div class="big" id="res">-</div>
  <div class="max">/ <span id="max">40</span></div>
</div>

<button onclick="chg(-10)">-10</button>
<button onclick="chg(-1)">-1</button>
<button onclick="chg(1)">+1</button>
<button onclick="chg(10)">+10</button><br>

<button onclick="draw()">抽選</button>
<button onclick="resetR()">リセット</button>
</div>

</div>
</div>

<script>
const URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ6hu2HGH9XN1d3Pj8euPrv49TgqM-GsPJNqge6IiRoqvXpNWuRFteTEufF-ffT5WDpYtG4W25h4bxI/pub?gid=0&single=true&output=csv";

/* 時計 */
setInterval(()=>{
clock.textContent=new Date().toLocaleTimeString();
},1000);

/* CSV */
async function get(){
const t=await fetch(URL);
const tx=await t.text();
const rows=tx.split("\n");

let data={};
rows.forEach(r=>{
let c=r.split(",");
if(c.length<10)return;
if(c[1]!="3-1")return;
data[c[0]]=c;
});
return data;
}

function key(d){
return d.toISOString().split("T")[0];
}

function makeHeader(d,type){
const w=["日","月","火","水","木","金","土"];
return `${d.getMonth()+1}/${d.getDate()}(${w[d.getDay()]})　${type||""}`;
}

function drawTable(id,row){
let h="";
for(let i=2;i<=7;i++){
h+=`
<div class="row">
  <div class="period">${i-1}時間目</div>
  <div class="subject">${row[i]||""}</div>
</div>`;
}
document.getElementById(id).innerHTML=h;
}

async function load(){
const data=await get();
const t=new Date();
const k=key(t);

if(data[k]){
drawTable("today",data[k]);
todayH.textContent=makeHeader(t,data[k][8]);
todayP.textContent=data[k][9]||"";
}
}
load();

/* 🔔 音（安定版） */
const ctx=new (window.AudioContext||window.webkitAudioContext)();

function beep(){
const o=ctx.createOscillator();
const g=ctx.createGain();
o.frequency.value=1200;
o.type="square";
o.connect(g);
g.connect(ctx.destination);
o.start();
g.gain.setValueAtTime(1,ctx.currentTime);
g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.15);
o.stop(ctx.currentTime+0.15);
}

let beepLoop;
function startBeep(){
if(beepLoop)return;
beepLoop=setInterval(beep,300);
}
function stopBeep(){
clearInterval(beepLoop);
beepLoop=null;
}

/* タイマー */
let t=0,ti;
function format(s){
return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
}
function add(s){t+=s;timer.textContent=format(t);}
function startT(){
if(ti)return;
ti=setInterval(()=>{
if(t<=0){
clearInterval(ti);
ti=null;
startBeep();
return;
}
t--;
timer.textContent=format(t);
},1000);
}
function resetT(){
clearInterval(ti);
ti=null;
t=0;
timer.textContent="00:00";
stopBeep();
}
</script>

</body>
</html>
