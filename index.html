<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>教室表示</title>

<link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
}

body{
  font-family:'Kosugi Maru',sans-serif;
  background:linear-gradient(135deg,#d9f3ff,#fff7d6);
}

/* 左上 */
#topLeft{
  position:absolute;
  left:20px;
  top:10px;
  display:flex;
  gap:8px;
}

#classSelect{
  font-size:2vw;
  border:none;
  background:transparent;
}

.iconBtn{
  width:34px;
  height:34px;
  border:none;
  border-radius:50%;
  background:#6fa8dc;
  color:white;
  font-size:18px;
  cursor:pointer;
}

/* 上 */
.top{
  text-align:center;
  height:18vh;
}

.date{
  font-size:2vw;
}

.clock{
  font-size:9vw;
  font-weight:900;
}

/* メイン */
.main{
  display:flex;
  height:82vh;
  gap:1vw;
  padding:1vw;
}

.left{
  flex:2;
  display:flex;
  gap:1vw;
}

.card{
  flex:1;
  background:white;
  border-radius:20px;
  padding:1vw;
}

.header{
  text-align:center;
  font-size:1.8vw;
}

.type{
  font-size:1.2vw;
  color:#666;
}

/* 行 */
.row{
  display:grid;
  grid-template-columns:30% 70%;
  font-size:2vw;
  align-items:center;
  height:5vh;
}

.row div:first-child{
  font-size:1.2vw;
}

/* 予定 */
.plan{
  font-size:1.8vw;
  background:#fff3cd;
  margin-top:1vh;
  padding:6px;
}

/* 右 */
.right{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:1vh;
}

.tool{
  flex:1;
  background:white;
  border-radius:20px;
  padding:0.7vw;
  text-align:center;
}

.big{
  font-size:4vw;
  font-weight:900;
}

button{
  border:none;
  border-radius:10px;
  padding:4px 8px;
  margin:2px;
  font-size:0.9vw;
  background:linear-gradient(135deg,#74ebd5,#9face6);
  color:white;
}

input{
  font-size:1vw;
}
</style>
</head>

<body>

<div id="topLeft">
  <select id="classSelect"></select>
  <button class="iconBtn" onclick="reloadData()">⟳</button>
</div>

<div class="top">
  <div id="date"></div>
  <div id="clock"></div>
</div>

<div class="main">

<div class="left">
  <div class="card">
    <div id="todayHeader"></div>
    <div id="today"></div>
    <div id="todayPlan"></div>
  </div>

  <div class="card">
    <div id="tomorrowHeader"></div>
    <div id="tomorrow"></div>
    <div id="tomorrowPlan"></div>
  </div>
</div>

<div class="right">

<div class="tool">
  <div class="big" id="timer">00:00</div>
  <button onclick="addTime(600)">10分</button>
  <button onclick="addTime(60)">1分</button>
  <button onclick="addTime(10)">10秒</button>
  <button onclick="addTime(1)">1秒</button><br>
  <button onclick="startTimer()">開始</button>
  <button onclick="resetTimer()">リセット</button>
</div>

<div class="tool">
  <div class="big" id="sw">00:00.0</div>
  <button onclick="swStart()">開始</button>
  <button onclick="swStop()">停止</button>
  <button onclick="swReset()">リセット</button>
</div>

<div class="tool">
  <div class="big" id="result">-</div>
  <input id="max" type="number" value="40">
  <button onclick="draw()">抽選</button>
</div>

</div>
</div>

<script>
const SHEET_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ6hu2HGH9XN1d3Pj8euPrv49TgqM-GsPJNqge6IiRoqvXpNWuRFteTEufF-ffT5WDpYtG4W25h4bxI/pub?output=csv";

const classList=["1-1","1-2","1-3","1-4","2-1","2-2","2-3","2-4","3-1","3-2","3-3","3-4","s-1","s-2","s-3","a-1","a-2","a-3"];

let classId="3-1";

classList.forEach(c=>{
  classSelect.innerHTML+=`<option value="${c}">${c}</option>`;
});

function reloadData(){
  classId=classSelect.value;
  load();
}

// 日本時間キー
function getJPDateKey(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

// 時計
setInterval(()=>{
  const n=new Date();
  clock.textContent=n.toLocaleTimeString('ja-JP');
  date.textContent=n.toLocaleDateString('ja-JP',{year:'numeric',month:'numeric',day:'numeric',weekday:'short'});
},1000);

// データ取得
async function fetchData(){
  const res=await fetch(SHEET_URL);
  const text=await res.text();
  const rows=text.split("\n");

  let data={};

  for(let r of rows){
    if(!r.trim()) continue;

    const c=r.split(",");
    if(c.length<9) continue;

    if(c[1]!==classId) continue;

    data[c[0]]=c.slice(2);
  }

  return data;
}

// 表示
function render(id,row){
  let h="";
  for(let i=0;i<6;i++){
    const sub=row[i]||"";
    h+=`<div class="row"><div>${sub?i+1+"時間目":""}</div><div>${sub}</div></div>`;
  }
  document.getElementById(id).innerHTML=h;
}

// メイン
async function load(){
  const all=await fetchData();

  today.innerHTML="";
  tomorrow.innerHTML="";
  todayPlan.textContent="";
  tomorrowPlan.textContent="";
  todayHeader.textContent="";
  tomorrowHeader.textContent="";

  const todayDate=new Date();
  const key=getJPDateKey(todayDate);

  if(all[key]){
    const row=all[key];

    render("today",row);

    todayHeader.innerHTML=
      todayDate.toLocaleDateString('ja-JP',{month:'numeric',day:'numeric',weekday:'short'})
      + ` <span class="type">${row[6]||""}</span>`;

    todayPlan.textContent=(row[7]||"");
  }

  let d=new Date();
  for(let i=0;i<40;i++){
    d.setDate(d.getDate()+1);
    const k=getJPDateKey(d);

    if(all[k]){
      const row=all[k];

      render("tomorrow",row);

      tomorrowHeader.innerHTML=
        d.toLocaleDateString('ja-JP',{month:'numeric',day:'numeric',weekday:'short'})
        + ` <span class="type">${row[6]||""}</span>`;

      tomorrowPlan.textContent=(row[7]||"");
      break;
    }
  }
}

load();

/* ツール */
let t=0,ti;
function updateTimer(){timer.textContent=String(Math.floor(t/60)).padStart(2,'0')+":"+String(t%60).padStart(2,'0');}
function startTimer(){clearInterval(ti);ti=setInterval(()=>{if(t<=0){clearInterval(ti);beep();return;}t--;updateTimer();},1000);}
function resetTimer(){clearInterval(ti);t=0;updateTimer();}
function addTime(s){t+=s;updateTimer();}

function beep(){
  const ctx=new AudioContext();
  let c=0;
  const i=setInterval(()=>{
    const o=ctx.createOscillator();
    o.frequency.value=1500;
    o.connect(ctx.destination);
    o.start();
    setTimeout(()=>o.stop(),100);
    if(++c>=16) clearInterval(i);
  },150);
}

let swt=0,swi;
function swUpdate(){sw.textContent=String(Math.floor(swt/600)).padStart(2,'0')+":"+String(Math.floor(swt/10)%60).padStart(2,'0')+"."+(swt%10);}
function swStart(){if(swi)return;swi=setInterval(()=>{swt++;swUpdate();},100);}
function swStop(){clearInterval(swi);swi=null;}
function swReset(){swStop();swt=0;swUpdate();}

function draw(){
  const max=document.getElementById("max").value;
  result.textContent=Math.floor(Math.random()*max)+1;
}
</script>

</body>
</html>
