<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>教室表示</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
}

body{
  font-family:'Noto Sans JP',sans-serif;
  background:linear-gradient(135deg,#d9f3ff,#fff7d6);
}

/* 左上 */
#topLeft{
  position:absolute;
  left:15px;
  top:10px;
  display:flex;
  gap:8px;
}

#classSelect{
  font-size:2vh;
}

.iconBtn{
  font-size:2vh;
}

/* 上 */
.top{
  height:18%;
  text-align:center;
}

.date{
  font-size:3vh;
}

.clock{
  font-size:10vh;
  font-weight:700;
}

/* メイン */
.main{
  height:82%;
  display:flex;
  gap:0.5vw;
  padding:0.5vw;
  box-sizing:border-box;
}

.left{
  flex:2;
  display:flex;
  gap:0.5vw;
}

.card{
  flex:1;
  background:white;
  border-radius:12px;
  padding:0.8vw;
  display:flex;
  flex-direction:column;
}

.header{
  text-align:center;
  font-size:3vh;
  font-weight:700;
}

.row{
  display:grid;
  grid-template-columns:30% 70%;
  font-size:3.2vh;
  padding:4px 0;
}

.plan{
  font-size:2.5vh;
  background:#fff3cd;
  border-radius:6px;
  padding:4px;
  margin-top:auto;
}

/* 右 */
.right{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:0.5vh;
}

.tool{
  flex:1;
  background:white;
  border-radius:12px;
  padding:0.5vw;
  text-align:center;
}

.big{
  font-size:5vh;
  font-weight:700;
}

button{
  font-size:1.6vh;
  padding:3px 6px;
  margin:2px;
  border:none;
  border-radius:6px;
  background:#6fa8dc;
  color:white;
}
</style>
</head>

<body>

<div id="topLeft">
  <select id="classSelect"></select>
  <button class="iconBtn" onclick="reloadData()">⟳</button>
</div>

<div class="top">
  <div class="date" id="date"></div>
  <div class="clock" id="clock"></div>
</div>

<div class="main">

<div class="left">
  <div class="card">
    <div class="header" id="todayHeader"></div>
    <div id="today"></div>
    <div class="plan" id="todayPlan"></div>
  </div>

  <div class="card">
    <div class="header" id="tomorrowHeader"></div>
    <div id="tomorrow"></div>
    <div class="plan" id="tomorrowPlan"></div>
  </div>
</div>

<div class="right">

<div class="tool">
  <div class="big" id="timer">00:00</div>
  <button onclick="addTime(60)">+1分</button>
  <button onclick="startTimer()">開始</button>
  <button onclick="resetTimer()">リセット</button>
</div>

<div class="tool">
  <div class="big" id="sw">00:00.0</div>
  <button onclick="swStart()">開始</button>
  <button onclick="swStop()">停止</button>
  <button onclick="swReset()">リセット</button>
</div>

<div class="tool">
  <div class="big" id="result">-</div>
  <div id="maxDisplay">40</div>
  <button onclick="changeMax(-1)">-1</button>
  <button onclick="changeMax(1)">+1</button>
  <button onclick="draw()">抽選</button>
  <button onclick="resetDraw()">リセット</button>
</div>

</div>
</div>

<script>
const SHEET_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ6hu2HGH9XN1d3Pj8euPrv49TgqM-GsPJNqge6IiRoqvXpNWuRFteTEufF-ffT5WDpYtG4W25h4bxI/pub?gid=0&single=true&output=csv";

const classList=["1-1","1-2","1-3","1-4","2-1","2-2","2-3","2-4","3-1","3-2","3-3","3-4"];

let classId="3-1";
let cache=null;

classList.forEach(c=>{
  classSelect.innerHTML+=`<option value="${c}">${c}</option>`;
});

/* クラス切替 */
function reloadData(){
  classId=classSelect.value;
  load();
}

/* 時計 */
setInterval(()=>{
  const n=new Date();
  clock.textContent=n.toLocaleTimeString('ja-JP');
  date.textContent=n.toLocaleDateString('ja-JP',{year:'numeric',month:'numeric',day:'numeric',weekday:'short'});
},1000);

/* CSV */
async function fetchData(){
  if(cache) return cache;
  const res=await fetch(SHEET_URL);
  const text=await res.text();
  const rows=text.split("\n");

  let data={};

  for(let r of rows){
    const c=r.split(",");
    if(c.length<10) continue;

    if(c[1]!==classId) continue;

    data[c[0]]=c.slice(2);
  }

  cache=data;
  return data;
}

/* 日付 */
function getKey(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

/* 表示 */
function render(id,row){
  let h="";
  for(let i=0;i<6;i++){
    h+=`<div class="row"><div>${i+1}時間目</div><div>${row[i]||""}</div></div>`;
  }
  document.getElementById(id).innerHTML=h;
}

async function load(){
  cache=null; // ← クラス変更で再取得
  const all=await fetchData();

  today.innerHTML="";
  tomorrow.innerHTML="";

  const t=new Date();
  const key=getKey(t);

  if(all[key]){
    render("today",all[key]);
    todayHeader.textContent=t.toLocaleDateString('ja-JP',{month:'numeric',day:'numeric',weekday:'short'});
    todayPlan.textContent=all[key][7]||"";
  }

  let d=new Date();
  for(let i=0;i<30;i++){
    d.setDate(d.getDate()+1);
    const k=getKey(d);
    if(all[k]){
      render("tomorrow",all[k]);
      tomorrowHeader.textContent=d.toLocaleDateString('ja-JP',{month:'numeric',day:'numeric',weekday:'short'});
      tomorrowPlan.textContent=all[k][7]||"";
      break;
    }
  }
}

load();

/* タイマー */
let t=0,ti=null;
function startTimer(){
  if(ti) return;
  ti=setInterval(()=>{
    if(t<=0){clearInterval(ti);ti=null;return;}
    t--;
    timer.textContent=Math.floor(t/60)+":"+String(t%60).padStart(2,'0');
  },1000);
}
function resetTimer(){clearInterval(ti);ti=null;t=0;timer.textContent="00:00";}
function addTime(s){t+=s;}

/* SW */
let swt=0,swi=null;
function swStart(){if(swi)return;swi=setInterval(()=>{swt++;sw.textContent=(swt/10).toFixed(1);},100);}
function swStop(){clearInterval(swi);swi=null;}
function swReset(){swStop();swt=0;sw.textContent="00:00.0";}

/* 抽選 */
let max=40;
function changeMax(n){max+=n;if(max<1)max=1;maxDisplay.textContent=max;}
function draw(){result.textContent=Math.floor(Math.random()*max)+1;}
function resetDraw(){result.textContent="-";}
</script>

</body>
</html>
