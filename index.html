<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>教室表示</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  background:#000;
}

/* 自動フィット */
#wrapper{
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:linear-gradient(135deg,#d9f3ff,#fff7d6);
}

#app{
  width:1920px;
  height:1080px;
  transform-origin: top left;
  font-family:'Noto Sans JP',sans-serif;
}

/* 時計 */
.top{
  height:20vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
#clock{
  font-size:18vh;
  font-weight:700;
}

/* クラス */
#control{
  position:absolute;
  top:20px;
  left:20px;
}

/* メイン */
.main{
  display:flex;
  height:80vh;
}

/* 日課（少し細く） */
.card{
  flex:1;
  margin:10px;
  background:white;
  border-radius:15px;
  padding:15px;
}

.header{
  font-size:5.6vh;
  text-align:center;
  font-weight:700;
}

.row{
  display:flex;
  align-items:center;
  margin:10px 0;
}

.period{
  width:5em;
  font-size:3.2vh;
}

.subject{
  flex:1;
  font-size:5.6vh;
  min-height:1.2em;
}
.subject:empty::before{
  content:"　";
}

.plan{
  font-size:4.8vh;
  background:#fff3cd;
  margin-top:10px;
  padding:8px;
}

/* 右 */
.right{
  flex:1.6;
  display:flex;
  flex-direction:column;
}

.tool{
  flex:1;
  background:white;
  margin:6px;
  border-radius:15px;
  padding:10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

/* 左（数字） */
.tool-left{
  flex:1;
  text-align:center;
}

.big{
  font-size:9vh;
  font-weight:700;
}

/* 右（ボタン） */
.tool-right{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
}

/* 横並びボタン */
.btn-row{
  display:flex;
}

button{
  margin:3px;
  padding:6px 10px;
  font-size:3.2vh;
  border:none;
  border-radius:8px;
  background:#6fa8dc;
  color:white;
}

/* 抽選 */
.drawTop{
  display:flex;
  justify-content:center;
  align-items:baseline;
  gap:10px;
}
.max{
  font-size:4vh;
}
</style>
</head>

<body>

<div id="wrapper">
<div id="app">

<div id="control">
<select id="cls" style="font-size:3.2vh;"></select>
<button onclick="reload()">⟳</button>
</div>

<div class="top">
<div id="clock"></div>
</div>

<div class="main">

<!-- 今日 -->
<div class="card">
<div class="header" id="todayH"></div>
<div id="today"></div>
<div class="plan" id="todayP"></div>
</div>

<!-- 明日 -->
<div class="card">
<div class="header" id="tomorrowH"></div>
<div id="tomorrow"></div>
<div class="plan" id="tomorrowP"></div>
</div>

<!-- 右 -->
<div class="right">

<!-- タイマー -->
<div class="tool">
<div class="tool-left">
<div class="big" id="timer">00:00</div>
</div>
<div class="tool-right">
<div class="btn-row">
<button onclick="add(600)">＋10分</button>
<button onclick="add(60)">＋1分</button>
</div>
<div class="btn-row">
<button onclick="add(10)">＋10秒</button>
<button onclick="add(1)">＋1秒</button>
</div>
<div class="btn-row">
<button onclick="startT()">開始</button>
<button onclick="resetT()">リセット</button>
</div>
</div>
</div>

<!-- ストップウォッチ -->
<div class="tool">
<div class="tool-left">
<div class="big" id="sw">00:00.0</div>
</div>
<div class="tool-right">
<div class="btn-row">
<button onclick="startSW()">開始</button>
<button onclick="stopSW()">停止</button>
<button onclick="resetSW()">リセット</button>
</div>
</div>
</div>

<!-- 抽選 -->
<div class="tool">
<div class="tool-left">
<div class="drawTop">
<div class="big" id="res">-</div>
<div class="max">/ <span id="max">40</span></div>
</div>
</div>
<div class="tool-right">
<div class="btn-row">
<button onclick="chg(-10)">-10</button>
<button onclick="chg(-1)">-1</button>
<button onclick="chg(1)">+1</button>
<button onclick="chg(10)">+10</button>
</div>
<div class="btn-row">
<button onclick="draw()">抽選</button>
<button onclick="resetR()">リセット</button>
</div>
</div>
</div>

</div>
</div>

</div>
</div>

<script>
/* フィット */
function fit(){
const w = window.innerWidth / 1920;
const h = window.innerHeight / 1080;
document.getElementById("app").style.transform = `scale(${Math.min(w,h)})`;
}
window.addEventListener("resize", fit);
fit();

/* クラス */
const list=["1-1","1-2","1-3","1-4","2-1","2-2","2-3","2-4","3-1","3-2","3-3","3-4"];
list.forEach(c=>cls.innerHTML+=`<option>${c}</option>`);
let current="3-1";

/* 時計 */
setInterval(()=>clock.textContent=new Date().toLocaleTimeString(),1000);

/* CSV */
const URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ6hu2HGH9XN1d3Pj8euPrv49TgqM-GsPJNqge6IiRoqvXpNWuRFteTEufF-ffT5WDpYtG4W25h4bxI/pub?gid=0&single=true&output=csv";

async function get(){
const t=await fetch(URL);
const tx=await t.text();
const rows=tx.split("\n");

let data={};
rows.forEach(r=>{
let c=r.split(",");
if(c.length<10)return;
if(c[1]!=current)return;
data[c[0]]=c;
});
return data;
}

function key(d){return d.toISOString().split("T")[0];}

function makeHeader(d,type){
const w=["日","月","火","水","木","金","土"];
return `${d.getMonth()+1}/${d.getDate()}(${w[d.getDay()]})　${type||""}`;
}

function drawTable(id,row){
let h="";
for(let i=2;i<=7;i++){
h+=`<div class="row"><div class="period">${i-1}時間目</div><div class="subject">${row[i]||""}</div></div>`;
}
document.getElementById(id).innerHTML=h;
}

async function load(){
const data=await get();
today.innerHTML=""; tomorrow.innerHTML="";
todayP.textContent=""; tomorrowP.textContent="";

const t=new Date();
const k=key(t);

if(data[k]){
drawTable("today",data[k]);
todayH.textContent=makeHeader(t,data[k][8]);
todayP.textContent=data[k][9]||"";
}
}

function reload(){current=cls.value; load();}
load();

/* タイマー */
let t=0,ti;
function format(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}
function add(s){t+=s;timer.textContent=format(t);}
function startT(){
if(ti)return;
ti=setInterval(()=>{
if(t<=0){clearInterval(ti);ti=null;return;}
t--;timer.textContent=format(t);
},1000);
}
function resetT(){clearInterval(ti);ti=null;t=0;timer.textContent="00:00";}

/* SW */
let swt=0,swi;
function startSW(){
if(swi)return;
swi=setInterval(()=>{
swt++;
let m=Math.floor(swt/600);
let s=Math.floor((swt%600)/10);
let ms=swt%10;
sw.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${ms}`;
},100);
}
function stopSW(){clearInterval(swi);swi=null;}
function resetSW(){stopSW();swt=0;sw.textContent="00:00.0";}

/* 抽選 */
let maxN=40;
function chg(n){maxN+=n;if(maxN<1)maxN=1;max.textContent=maxN;}
function draw(){res.textContent=Math.floor(Math.random()*maxN)+1;}
function resetR(){res.textContent="-";}
</script>

</body>
</html>
